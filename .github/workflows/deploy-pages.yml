# Deploys the regen-toolkit-os branch's site to GitHub Pages as a PREVIEW
# (a separate surface from the Vercel deploy, which builds `main`).
# One-time setup: repo → Settings → Pages → Source: "GitHub Actions".
# Preview URL: https://explorience.github.io/regen-toolkit/
name: Deploy site preview to GitHub Pages

on:
  push:
    branches: [regen-toolkit-os]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let a newer run cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (base = /regen-toolkit/)
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
