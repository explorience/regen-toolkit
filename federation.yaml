# federation.yaml — Regen Web3 Toolkit
# Network topology and trust relationships for this org-os instance.

schema_version: "2.0"

identity:
  id: regen-toolkit
  name: "Regen Web3 Toolkit"
  type: project
  chain: eip155:100

network: "regen-coordination"
hub: "github.com/regen-coordination"
role: project

upstream:
  - type: "template"
    url: "https://github.com/regen-coordination/org-os-template.git"
    repository: "https://github.com/regen-coordination/org-os-template.git"
    branch: main
    last_sync: "2026-04-24"
    sync_mode: overlay

peers:
  - id: regen-coordination-os
    name: "Regen Coordination"
    type: network
    trust: canonical
    path: "../regen-coordination-os"
    repository: github.com/regen-coordination/regen-coordination-os

knowledge_commons:
  enabled: true
  protocol: git
  role: contributor
