schema: encyclopedia-entry
object:
  title: Inclusive Practices for Community Finance
  type: encyclopedia-entry
  page_type: guide
  summary: >-
    Argues that community finance systems default to excluding the same people
    banks already exclude unless designed otherwise, and lays out five
    dimensions of inclusion (economic, technical, temporal, social,
    accessibility), practical strategies (plain language, multiple on-ramps,
    rotating what gets centered, explicit invitation, accountability), common
    mistakes (tokenism, one-size-fits-all design, uncompensated burden on
    marginalized groups), and community-finance-specific barriers (financial
    literacy, technical barriers, time poverty, trust barriers) with matched
    solutions.
  audience: community stewards designing or running a community finance system
  known_tensions:
    - >-
      counting-participation-is-easy-vs-measuring-whether-people-feel-valued-and-influence-decisions-is-the-actual-goal
    - >-
