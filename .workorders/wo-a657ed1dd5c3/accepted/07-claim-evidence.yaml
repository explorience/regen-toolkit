  title: Coalition of 15 environmental nonprofits improved via multisig treasury
  type: claim-evidence
  claim: >-
    A coalition of 15 environmental nonprofits moved its pooled treasury from a
    traditional bank account (where transparency was "always an issue") to a
    multi-sig wallet, giving every member visibility into funds, onchain voting
    on decisions, and the ability to accept donations from anywhere; per the
    account, "our coalition actually functioned better" afterward.
  evidence: >-
