schema: encyclopedia-entry
object:
  title: Treasury Management for DAOs
  type: encyclopedia-entry
  page_type: guide
  summary: >-
    Practical guide to DAO treasury management: the "native token problem" (thin
    liquidity, extreme volatility, broken operational continuity when a treasury
    holds mostly its own governance token), the case for holding 2-3 years of
    operating expenses in stablecoins, four diversification methods (earning
    stablecoin revenue, strategic token sales, strategic partnerships, borrowing
    against tokens), and Maya Protocol as a transitioning-to-DAO-governance
    example.
  audience: 🌱 Maya (beginner track, DAO governance/finance foundations)
  known_tensions:
    - >-
      diversification improves resilience but strategic token sales and
      borrowing both carry market-impact / liquidation risk
    - >-
      treasury management choices are framed as governance choices (who holds
      power), not purely financial ones
  related_concepts:
    - dao-treasury-diversification
    - native-token-concentration-risk
  related_resources:
    - Maya Protocol
    - Aave
    - Gnosis Auction
