schema: encyclopedia-entry
object:
  title: Voting Mechanisms in DAOs
  type: encyclopedia-entry
  page_type: comparison
  summary: >-
    Compares six DAO decision-making mechanisms — token-based quorum voting,
    quadratic voting, conviction voting, holographic consensus, multi-sig
    voting, and off-chain voting via Snapshot — on the trade-offs of speed vs
    inclusivity, simplicity vs manipulation-resistance, and participation vs
    scalability, and notes that most mature DAOs combine several mechanisms
    rather than relying on one.
  audience: DAO operators choosing or designing a governance/voting process
  known_tensions:
    - >-
      speed vs inclusivity (multi-sig fast-but-concentrated vs conviction-voting
      open-but-slow)
    - >-
      simplicity vs manipulation-resistance (quorum voting easy-to-understand
      but vulnerable)
    - participation vs scalability (everyone-votes-on-everything does not scale)
  related_concepts:
    - dao-voting-mechanisms
    - token-weighted-governance
  related_resources:
    - Snapshot
    - Giveth
    - Moloch DAO
