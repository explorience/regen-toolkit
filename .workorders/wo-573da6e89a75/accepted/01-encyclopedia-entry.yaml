  type: encyclopedia-entry
  page_type: guide
  summary: >-
    A short guide for local-node builders on finding mentors, peer networks,
    technical support, and funding support. Names four support types (mentorship
    via other node leaders/cooperative-development orgs/community
    foundations/social-enterprise mentors; peer networks of similarly-staged
    nodes; technical support via developer communities and protocol teams;
    funding support via Gitcoin Grants, Giveth, and local funds), four ways to
    find mentors, and norms for being a good mentee.
