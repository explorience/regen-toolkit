schema: encyclopedia-entry
object:
  title: Knowledge Gardens
  type: encyclopedia-entry
  page_type: guide
  summary: >-
    How to build a community knowledge garden that survives contributor
    turnover: linking over filing, openly-marked growth stages
    (seedling/budding/evergreen), and active tending by a named gardener. Uses
    SuperBenefit's public Knowledge Garden as a worked model (Docs, Lexicon,
    Links, Patterns) and recommends plain markdown + Git (Obsidian + Quartz +
    GitHub) as the durable, non-lock-in tool stack.
  audience: >-
    community organizers and local-node stewards building a team knowledge
    commons
  known_tensions:
    - >-
      polished, collaboration-friendly tools (Notion) vs. durable,
      portable-in-plain-text tools (Markdown + Git) — the article resolves this
      as "own your source of truth in plain text and Git; use anything prettier
      as a window onto it, not the vault itself"
  related_concepts:
    - Digital Garden (seedling/budding/evergreen)
    - knowledge commons
  related_resources:
    - Obsidian
    - Quartz
    - SuperBenefit Knowledge Garden
    - GravityDAO
