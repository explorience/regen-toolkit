  what_it_curates: >-
    A mobile-app-based protocol for documenting tree planting: photo +
    geolocation capture, AI + community verification of tree existence and
    species, and automated stablecoin (cUSD/USDC) payment to planters once
    verified, all recorded on-chain. Integrates the Treekipedia tree-species
    database.
