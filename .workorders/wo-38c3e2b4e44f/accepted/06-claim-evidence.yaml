schema: claim-evidence
object:
  title: Ethereum's move to proof-of-stake cut energy use ~99.95%
  type: claim-evidence
  claim: >-
    Ethereum and the networks most regenerative projects use (Ethereum, Polygon,
    Arbitrum) run on proof-of-stake, which cut Ethereum's energy use by about
    99.95% when it switched over ("the Merge") in September 2022 — so
    holding/using a seed phrase carries negligible energy cost.
  evidence: >-
    Article cites Ethereum Foundation's official Merge/energy roadmap page
    (ethereum.org/en/roadmap/merge/) for the ~99.95% figure and September 2022
    date.
  source_lineage: src/content/docs/seed-phrases.md
  interpretation: >-
    Used in the article to address a permaculture/climate-work reader's worry
    that crypto is inherently energy-intensive; the claim is scoped to
    proof-of-stake chains, not Bitcoin.
  uncertainty: >-
    Figure and date are as stated by the cited Ethereum Foundation source; not
    independently re-verified in this ingestion pass. Polygon/Arbitrum being
    "proof-of-stake" is stated as a blanket claim without per-chain sourcing.
  maturity: raw
  ai_assisted: true
  provenance:
    origin: src/content/docs/seed-phrases.md
    transformation: summarized
    authorship: ai-assisted
  work_order: wo-38c3e2b4e44f
