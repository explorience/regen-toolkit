  summary: >-
    A quick, plain-language explainer of blockchain gas fees: what gas is and
    why it exists (pay validators, prevent spam, allocate block space), the
    EIP-1559 base-fee + tip fee model (base fee auto-adjusts with demand and is
    burned; priority fee/tip jumps the queue), typical gas costs by transaction
    type, what drives fees up or down (network demand, time of day, transaction
    complexity), and five ways to save (time transactions, avoid volatility
    spikes, use fee estimators, use Layer 2, set max fees).
