object:
  title: Common Concerns About Web3, Answered Honestly
  type: encyclopedia-entry
  page_type: guide
  summary: >-
    A myth-by-myth response to the standard newcomer worries about web3 for
    permaculturists and community organisers: is it a scam, is it only for the
    rich, is it just gambling, what about the environment, do I need to
    understand the tech, and what happens when I make mistakes. Distinguishes
    fraud (a human problem) from the tool, separates the volatile token from the
    underlying technology, and gives a precise (not hand-wavy) answer on energy
    use by contrasting proof-of-work and proof-of-stake networks.
  audience: >-
    permaculturists and community organisers new to Web3, weighing whether to
    look closer
  known_tensions:
    - transparency-as-scam-fighter vs transparency-does-not-stop-fraud
    - token-price-speculation vs the-underlying-coordination-technology
    - >-
