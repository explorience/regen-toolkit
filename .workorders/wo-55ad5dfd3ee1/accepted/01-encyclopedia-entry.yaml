    authorship: ai-assisted
  notes: >-
    assessed-but-excluded: no people/location/TEK/MRV high-risk content; the
    Hargeisa/Djibouti/sesame-trader scenario and sorghum-farmer/NGO examples are
    illustrative hypotheticals, not real named individuals, so no
    public-use-boundary or person-node created.
