schema: encyclopedia-entry
object:
  title: Building Internal Capacity
  type: encyclopedia-entry
  page_type: guide
  summary: >-
    A guide on developing the skills and systems a community needs to sustain
    web3 operations independently, without relying on external experts or
    consultants. Names four capacity areas (technical: wallet management, smart
    contract interaction, treasury operations, security; governance:
    facilitation, proposal writing, conflict resolution, decision-making;
    communication: writing, social media, community management, outreach;
    financial: bookkeeping, grant writing, budgeting, fundraising) and a
    five-step process to build it: identify gaps, map existing skills, create
    learning pathways, practice with low stakes, and document everything.
  audience: local node organizers investing in member skill development
