schema: encyclopedia-entry
object:
  title: Funding Your Gatherings
  type: encyclopedia-entry
  page_type: framework
  summary: >-
    A four-tier framework for funding local-node gatherings, from zero-budget
    (shared meals, free venues, skill contributions) through low ($10-100:
    member contributions, passing the hat, monthly dues), medium ($100-500:
    local business sponsorship, small grants, web3-native funding via Gitcoin
    Grants/Giveth/Endaoment) to large ($500+: ticket sales, tiered sponsors,
    speaker budgets, ecosystem grants like the Ethereum Foundation ESP). Core
    argument: start with the cheapest thing that works, be transparent about
    money, and don't outspend your community's actual capacity.
  audience: local regen node organizers planning their first gatherings
  known_tensions:
    - >-
      Recommends collecting contributions on-chain (multisig, Juicebox) as "the
      easiest real introduction to wallets your members will ever get" — a
      genuine convenience argument that also nudges a low-stakes social event
      toward on-chain tooling before it's strictly needed.
