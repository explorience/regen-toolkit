schema: encyclopedia-entry
object:
  title: Choosing a Model for Your Local Node
  type: encyclopedia-entry
  page_type: comparison
  summary: >-
    Compares four organizational models local ReFi nodes actually use — the
    Collective (5-10 people, consensus), Working Groups (10-30, domain autonomy,
    ReFi DAO's "Network Initiatives" as the network-scale example), the Council
    (20-50+, consent-based governance, ReFi DAO's Steward Council as the
    example), and the Cooperative (15+, formal legal entity) — with a
    size/formality/decision-speed/legal-protection comparison table and guidance
    to evolve on purpose between models as group size and treasury size grow,
    rather than in crisis.
  audience: local-node organizers deciding on or evolving their governance structure
  known_tensions:
    - >-
      structure vs. overhead — "the honest rule: pick the simplest model that
      holds your current size and stakes... structure you don't need yet is just
      overhead"
  related_concepts:
    - Consent-based Governance (sociocracy)
  related_resources:
