schema: encyclopedia-entry
object:
  title: 'Archive or Compost: Handling Outdated Knowledge Without Losing the Plot'
  type: encyclopedia-entry
  page_type: framework
  summary: >-
    A practical framework for retiring stale documents in a knowledge commons
    without deleting institutional memory or confusing readers. Names four moves
    — archive (preserve as labeled history), compost (harvest the still -good
    parts into living pages, retire the husk), deprecate (mark obsolete with a
    warning and a pointer), and remove (rare; last resort) — against the Regen
    Knowledge Commons Toolkit's Evolution Layer and cross-cutting principle #17,
    "compost, archive, and memory." Closes on the governance rule that keeps
    this from becoming chaos: a staleness flag is a signal, not a conclusion — a
    named steward decides which move applies and does it on the record.
  audience: teams stewarding docs/wikis that must outlive contributor turnover
  known_tensions:
    - >-
      most teams only know two verbs, keep and delete — keeping lets the wiki
      silently rot, deleting erases the memory of why a decision was made; the
      article's four-move framework is presented as the fix.
    - >-
      composting requires human judgment (deciding what's worth keeping) while
      archiving and deprecating are described as "near-mechanical" — the article
      treats this as why composting is the most valuable and least practiced of
      the four moves.
  related_concepts:
