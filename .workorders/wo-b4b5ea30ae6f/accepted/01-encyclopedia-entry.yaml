schema: encyclopedia-entry
object:
  title: Find Your Community
  type: encyclopedia-entry
  page_type: guide
  summary: >-
    A plain-language guide for community organizers and permaculturists on
    finding a trustworthy, real-world ReFi (regenerative finance) community
    without getting scammed or wasting time. Frames ReFi DAO and Greenpill
    Network as the two established "front doors," recommends listening before
    committing (field notes, public Telegram, assessment, steward call), and
    gives concrete rules for telling a real community from a scam (never share a
    seed phrase, real teams don't DM first, always type the known URL yourself,
    never send money first, big member counts aren't proof, slow is safe).
  audience: community organizers and permaculturists new to ReFi/web3, wary of scams
  known_tensions:
    - >-
      Encourages joining named, centralized-looking "front doors" (ReFi DAO,
      Greenpill) as the safe path, which is itself a form of gatekeeping — worth
      naming that "established" is being used as a proxy for "safe," not a
      guarantee.
