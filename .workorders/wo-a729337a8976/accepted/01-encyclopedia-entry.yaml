  type: encyclopedia-entry
  page_type: guide
  summary: >-
    A guide for nonprofits on talking to board, staff, and donors before/while
    adopting crypto donations: educate first, prepare the board on legality,
    tax, risk and asset-management questions, address volatility/security/
    complexity concerns openly, communicate the new option across channels once
    ready, and build reusable templates.
  audience: nonprofit leaders preparing to introduce crypto donations to their org
