object:
  title: How to Get Your First Crypto
  type: encyclopedia-entry
  page_type: guide
  summary: >-
    A scam-aware, "start tiny" guide for community organizers acquiring their
    first cryptocurrency, covering three ways in (centralized exchange,
    peer-to-peer with escrow, earning through paid work/bounties/staking), the
    energy objection (Bitcoin proof-of-work vs. Ethereum's post-Merge
    proof-of-stake), and a set of non-negotiable scam-avoidance habits.
  audience: >-
    community organizers and growers with no prior crypto experience, especially
    those weighing crypto for cross-border grant/donation receipt
  known_tensions:
    - >-
      convenience-of-a-centralized-exchange-vs-custody-risk-of-trusting-a-company
    - earning-crypto-through-real-work-vs-chasing-free-airdrops
  related_concepts:
    - peer-to-peer-crypto-exchange-with-escrow
  related_resources:
    - localcoinswap
    - bisq
  maturity: raw
  ai_assisted: true
  provenance:
