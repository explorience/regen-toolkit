    authorship: ai-assisted
  notes: >-
    assessed-but-excluded: Greenpill Network is not re-created as a new
    source-system object here — it already exists in data/kb/source-system.yaml
    from a prior ingestion slice. The Ethereum Merge ~99.95% energy-reduction
    claim and the "no legitimate service asks for your seed phrase" warning are
    not re-created as new claim-evidence objects — near-identical claims already
    exist in data/kb/claim-evidence.yaml. Coinbase/Kraken are not created as new
    resource objects (generic, well-known centralized exchanges named only in
    passing); LocalCoinSwap and Bisq were chosen as the more novel P2P-specific
    resources worth capturing.
