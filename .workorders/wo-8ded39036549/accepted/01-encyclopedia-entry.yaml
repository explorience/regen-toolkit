schema: encyclopedia-entry
object:
  title: What You Can Do on Ethereum
  type: encyclopedia-entry
  page_type: guide
  summary: >-
    A narrowly-scoped beginner guide, written for participants in "the Sarreya
    programs," that deliberately limits Ethereum's relevance to three concrete
    uses: (1) sending/receiving digital money (e.g. USDC stablecoin transfers,
    low "gas" fees), (2) earning verifiable digital credentials for completed
    trainings/skills, and (3) tracking and proving real-world impact (photo +
    location submitted and recorded on-chain), which the article names as
    digital measurement, reporting, and verification (dMRV), citing Silvi as an
    example program. Explicitly tells readers NOT to worry about NFTs, DeFi
    lending, staking, or app development.
  audience: >-
    participants in the Sarreya program(s); general audience individuals new to
    Ethereum
  known_tensions:
    - >-
      Simplicity vs. completeness — the article deliberately narrows scope to 3
      uses and tells the reader to ignore the rest of the Ethereum ecosystem,
      trading completeness for actionability.
  related_concepts:
    - dmrv
  related_resources:
    - silvi
  maturity: raw
  ai_assisted: true
  provenance:
    origin: src/content/docs/what-you-can-do-ethereum.md
    transformation: summarized
    authorship: ai-assisted
  notes: >-
