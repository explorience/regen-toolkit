why_it_matters: >-
  A community of research and practice focused on tools, institutions,
  standards, datasets, experiments, and communities that enable self-governance
  in the digital age. It bridges governance research, online-community practice,
  civic and DAO tooling, field memory, and institutional experimentation.
caution: >-
  Metagov contains projects at different maturity states. A research prototype,
  seminar, dataset, standard, completed project, paused tool, or speculative
  governance experiment should not be treated as the same kind of evidence.
  Community participation and public archives also require privacy, consent,
  attribution, and status-sensitive interpretation.
extraction_status: >-
  Governance datasets and taxonomies; community-authored governance procedures;
  interoperable deliberation; digital constitutions; polycentric and game-based
  governance experiments; AI-mediated knowledge infrastructure; standards
  development; practitioner–researcher convening; qualitative governance
  research funding.
