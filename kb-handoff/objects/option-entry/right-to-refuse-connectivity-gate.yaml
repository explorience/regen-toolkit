title: Right-to-Refuse Connectivity Gate
type: option-entry
category: impact-measurement
what_it_is: >-
  Require projects to consider whether people or communities want connectivity,
  what forms they want, and what data or surveillance they reject.
potential_uses: >-
  AI, sensors, public infrastructure, ecological monitoring, community
  databases.
dependencies: >-
  Informed deliberation, alternatives, non-retaliation, reversibility and
  collective rights.
tradeoffs: >-
  Could be used by states or funders to justify neglecting desired
  infrastructure.
