title: Constituency Assembly Input Layer
type: option-entry
category: governance
what_it_is: >-
  Give affected constituencies autonomous spaces to build agendas before and
  alongside general decision processes.
potential_uses: >-
  Toolkit governance, contributor review, affected-party consultation,
  public-use decisions.
dependencies: >-
  Real agenda-setting power, translation, accessibility, compensation, feedback
  loops, safeguards against tokenization.
tradeoffs: >-
  Separate spaces can be underfunded, ignored by central governance or treated
