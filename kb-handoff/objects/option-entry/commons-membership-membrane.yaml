title: Commons Membership Membrane
type: option-entry
category: knowledge-documentation
what_it_is: >-
  Use a pledge, credentials, and conditional-use agreement to define access to
  shared knowledge or agent infrastructure.
potential_uses: >-
  Federated knowledge commons, member services, shared MCP servers,
  reciprocal-access systems.
dependencies: >-
  Clearly governed membership, appeal process, privacy-preserving credentials,
  accessible alternatives, versioned agreement.
tradeoffs: >-
  Can centralize gatekeeping, exclude informal contributors, create
  identity/privacy risks, and confuse access with legitimacy.
