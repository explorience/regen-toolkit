title: Governance Problem Mapping with Structured Interviews
type: option-entry
category: governance
what_it_is: >-
  Collect practitioner experiences, structure problems and solutions, map actors
  and dependencies, then publish a reviewable research roadmap.
potential_uses: >-
  Ecosystem sensemaking, research agendas, working-group formation, grant
  strategy, and gap analysis.
dependencies: >-
  Transparent sampling, interview protocol, consent, synthesis method, evidence
  links, challenge process, and iteration.
tradeoffs: >-
  Small or network-biased samples, AI framing effects, false precision in
  rankings, and premature solutionism.
