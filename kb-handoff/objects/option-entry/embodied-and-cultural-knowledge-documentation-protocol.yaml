title: Embodied and Cultural Knowledge Documentation Protocol
type: option-entry
category: knowledge-documentation
what_it_is: >-
  Allow cultural, spiritual, artistic and embodied practices to be acknowledged
  without extracting, standardizing or exposing them.
potential_uses: Event memory, community knowledge, media archives, facilitation review.
dependencies: >-
  Community-defined boundaries, attribution, context, non-recording options,
  language and cultural review.
tradeoffs: >-
  Documentation can appropriate sacred or situated practices and turn living
  culture into generic methods.
