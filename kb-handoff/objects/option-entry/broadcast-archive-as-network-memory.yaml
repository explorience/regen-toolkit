title: Broadcast Archive as Network Memory
type: option-entry
category: funding-capital
what_it_is: >-
  Maintain dated reports, field notes, retrospectives, and updates as a distinct
  source system linked to people, projects, claims, and implementation records.
potential_uses: >-
  Networks that need continuity without forcing all knowledge into a static
  wiki.
dependencies: >-
  Editorial stewardship, dates, status labels, corrections, durable links, and
  routing into structured records.
tradeoffs: >-
  Self-reporting bias, chronology without synthesis, stale claims, and confusing
  announcements with outcomes.
