title: Recursive Governance of Civic Software
type: option-entry
category: governance
what_it_is: >-
  Govern the participatory platform through a community that also uses
  participatory infrastructure to shape the project itself.
potential_uses: >-
  Open-source civic infrastructure, commons governance, contributor
  coordination, public-institution partnerships.
dependencies: >-
  Clear authority, association structure, open contribution paths,
  documentation, funding and maintenance.
tradeoffs: >-
  Participation may remain uneven; formal openness can hide technical or
  institutional gatekeeping.
