title: Movement Media as Layered Knowledge Commons
type: option-entry
category: knowledge-documentation
what_it_is: >-
  Treat newspapers, youth publications, radio, video, galleries and thematic
  pages as different media artifacts feeding field memory, learning and claims
  review.
potential_uses: >-
  Source discovery, implementation memory, multilingual public education,
  historical and current context.
dependencies: >-
  Editorial metadata, dates, authorship, safeguarding, accessibility,
  current-state filtering and source-status labels.
tradeoffs: >-
  Movement media can be mistaken for independent evidence or become difficult to
  maintain and search.
