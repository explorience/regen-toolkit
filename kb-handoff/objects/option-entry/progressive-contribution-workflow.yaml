title: Progressive Contribution Workflow
type: option-entry
category: organizational-structure
what_it_is: >-
  Offer a low-friction Quick Submit path that can later be expanded into a
  fuller structured and sourced record.
potential_uses: >-
  Contributor onboarding, event capture, implementation-memory intake,
