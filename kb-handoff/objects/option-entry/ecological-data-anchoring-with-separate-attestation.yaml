title: Ecological Data Anchoring with Separate Attestation
type: option-entry
category: impact-measurement
what_it_is: >-
  Anchor a content hash and timestamp separately from later attestations by
  identified verifiers.
potential_uses: >-
  Evidence provenance, ecological monitoring records, audit trails, claims
  infrastructure, data lineage.
dependencies: >-
  Persistent source data, content addressing, identity and authority model,
  resolver availability, review policy.
tradeoffs: >-
  Anchoring may be mistaken for truth; attestors may lack competence or
  independence; off-chain data may disappear.
