title: Community-Authored Protocol Metadata
type: option-entry
category: knowledge-documentation
what_it_is: >-
  Allow relevant communities to define contextual access, circulation,
  attribution and use protocols that travel with records and exports.
potential_uses: >-
  Knowledge commons, archives, ecological data, cultural heritage, AI and public
  resource explorers.
dependencies: >-
  Community-controlled authoring, stable identifiers, customizable descriptions,
  technical integration and update propagation.
tradeoffs: >-
  Metadata can be stripped, ignored or treated as merely advisory; not suitable
  where publication itself is inappropriate.
