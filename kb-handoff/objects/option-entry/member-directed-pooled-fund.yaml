title: Member-Directed Pooled Fund
type: option-entry
category: governance
what_it_is: >-
  Allow members to propose, vote on, and help implement projects funded from a
  shared pool for the wider field.
potential_uses: >-
  Network governance, contributor funding, source-system maintenance,
  collaborative research.
dependencies: >-
  Clear eligibility, proposal support, voting method, conflict-of-interest
  rules, implementation reporting, and follow-up.
tradeoffs: >-
  Participation can be skewed by time, language, organizational capacity, and
  network centrality.
