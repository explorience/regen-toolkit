title: Multi-Stage Methodology Review
type: option-entry
category: coordination
what_it_is: >-
  Use internal review, expert peer review, public comment, revisions, and
  published document histories before a protocol becomes active.
potential_uses: >-
  Standards intake, option review, high-risk public guidance, ecological and
  civic methodologies.
dependencies: >-
  Reviewer selection, conflict disclosures, version control,
  response-to-comments, decision authority, archival access.
tradeoffs: >-
  Review can become slow, expensive, opaque, or falsely legitimizing;
  participation may be uneven.
