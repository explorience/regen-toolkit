title: Seed-Based Low-Friction Commons Intake
type: option-entry
category: implementation-operations
what_it_is: >-
  Invite small, unfinished contributions such as asks, hopes, or seeds before
  requiring full proposals or records.
potential_uses: >-
  Contributor onboarding, participatory discovery, needs sensing, early concept
  collection.
dependencies: Routing, moderation, follow-up, consent, spam controls, visible next actions.
tradeoffs: >-
  Contributions can become an unmaintained wish list or imply participation
  without real influence.
