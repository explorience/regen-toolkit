title: Vision–Indicator–Learning Loop
type: option-entry
category: organizational-structure
what_it_is: >-
  Start with plural desired futures, select indicators tied to those values,
  act, observe feedback and revise both interventions and goals.
potential_uses: Strategy, public programs, commons stewardship and theory of change.
dependencies: >-
  Inclusive visioning, explicit tradeoffs, indicators, review cadence and
  correction rights.
tradeoffs: >-
  Consensus visioning can suppress disagreement; indicators can narrow the
  vision.
