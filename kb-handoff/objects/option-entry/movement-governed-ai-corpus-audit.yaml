title: Movement-Governed AI Corpus Audit
type: option-entry
category: governance
what_it_is: >-
  A structured review of corpus selection, languages, permissions, authority,
  exclusions, citations and correction rights before treating a movement AI as a
  trusted knowledge system.
potential_uses: >-
  AI knowledge commons, agroecology assistants, movement archives, field
  guidance systems.
dependencies: >-
  Corpus inventory, steward roles, licensing and community protocols, language
  review, test queries, correction workflow.
tradeoffs: >-
  Can become bureaucratic, expose sensitive materials or privilege what is
  easiest to document.
