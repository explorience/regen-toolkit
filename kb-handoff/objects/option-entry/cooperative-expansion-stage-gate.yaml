title: Cooperative Expansion Stage Gate
type: option-entry
category: organizational-structure
what_it_is: >-
  Separate announced, financed, under-construction, commissioned, operating and
  maintained stages for agroindustrial projects.
potential_uses: Avoid treating expansion announcements as completed outcomes.
dependencies: >-
  Dated infrastructure records, financing documents, licenses, commissioning and
  operations evidence.
tradeoffs: >-
