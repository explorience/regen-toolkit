title: Curated Cause with AI-Assisted Distribution
type: option-entry
category: funding-capital
what_it_is: >-
  Bundle aligned projects into a donor-facing Cause and use a Donation Agent to
  allocate funds across them.
potential_uses: >-
  Thematic public-goods portfolios, local causes and recurring collective
  giving.
dependencies: >-
  Transparent inclusion rules, allocation model, human oversight, project
  updates, dispute paths and donor explanation.
tradeoffs: >-
  Opaque AI weighting, curator capture, popularity bias, weak accountability and
  unclear responsibility for errors.
