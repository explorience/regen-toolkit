title: Community-Led Classification Review
type: option-entry
category: impact-measurement
what_it_is: >-
  Let communities represented by high-impact categories review names,
  definitions, relationships, public-use states and correction paths.
potential_uses: >-
  Ontology, tagging, identity records, Indigenous/community data, labor and
  disability categories.
dependencies: >-
  Compensation, accessible formats, scoped authority, disagreement handling and
  provenance.
tradeoffs: >-
  No community has one voice; reviewers may be overburdened or treated as
  representatives of entire groups.
context: Design Justice / Toolkit
