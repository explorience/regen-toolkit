title: Low-Disclosure Access Intake
type: option-entry
category: implementation-operations
what_it_is: >-
  Ask only what formats, pacing and support are needed to participate rather
  than requesting diagnoses or personal justification.
potential_uses: >-
  Contributor onboarding, meetings, reviews, events and public correction
  processes.
dependencies: >-
  Trusted access contact, private operational storage, deletion rules and
  multiple participation routes.
tradeoffs: >-
  May still fail if available formats are poor or staff lack authority and
  resources to respond.
