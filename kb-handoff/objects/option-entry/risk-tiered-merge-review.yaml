title: Risk-Tiered Merge Review
type: option-entry
category: governance
what_it_is: >-
  Route merge decisions to different review depths based on identity
  consequence, sensitivity, claim risk, and public-use scope.
potential_uses: Scale duplicate review without sending every row to every reviewer.
dependencies: Risk taxonomy, reviewer roles, queues, escalation, sampling audits.
tradeoffs: >-
  Under-classification may bypass needed expertise; over-classification may
  stall work.
