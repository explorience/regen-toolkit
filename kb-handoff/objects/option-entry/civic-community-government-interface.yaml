title: Civic Community–Government Interface
type: option-entry
category: governance
what_it_is: >-
  Create porous but explicit interfaces through which civic communities, public
  servants and formal institutions exchange problems, prototypes, data and
  policy feedback.
potential_uses: >-
  Civic technology, digital public infrastructure, local government
  collaboration and public-commons partnerships.
dependencies: >-
  Institutional mandates, role clarity, procurement/funding, public
  accountability, conflict safeguards and community autonomy.
tradeoffs: >-
  Co-optation, informal elite access, blurred accountability and unequal
  community representation.
