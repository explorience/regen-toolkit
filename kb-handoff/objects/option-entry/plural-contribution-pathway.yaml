title: Plural Contribution Pathway
type: option-entry
category: governance
what_it_is: >-
  Allow money, volunteer labor, in-kind support, care work and knowledge
  contribution as distinct pathways while tracking burden and access.
potential_uses: Contributor governance, stewardship and network membership design.
dependencies: >-
  Transparent expectations, workload caps, compensation strategy and
  accessibility.
tradeoffs: >-
  Non-financial contribution can normalize unpaid labor and exclude people with
  limited time or capacity.
