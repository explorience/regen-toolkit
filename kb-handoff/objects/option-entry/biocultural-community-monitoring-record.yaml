title: Biocultural Community-Monitoring Record
type: option-entry
category: governance
what_it_is: >-
  Structure community-led monitoring, territorial governance, traditional
  knowledge, partner roles, public claims and registry events without separating
  ecological evidence from community authority.
potential_uses: >-
  Indigenous-led conservation, biodiversity finance and place-based stewardship
