title: Layered Network Organization Model
type: option-entry
category: governance
what_it_is: >-
  Use distinct but connected structures for broad solidarity, active
  coordination, experimentation/implementation support, and fiscal resourcing.
potential_uses: >-
  Networks that need openness without making every participant part of the same
  governance or operating body.
dependencies: >-
  Clear role boundaries, legal/fiscal structure, decision rights, handoffs,
  accountability, and public descriptions.
tradeoffs: >-
  Can create hidden hierarchy, role confusion, duplicated governance,
  gatekeeping, or a polished diagram unsupported by actual practice.
