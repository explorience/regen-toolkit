title: Federated Movement Knowledge Architecture
type: option-entry
category: knowledge-documentation
what_it_is: >-
  Combine autonomous member organizations, regional articulations, constituency
  assemblies, global conferences, declarations, newsletters and schools without
  creating one centralized knowledge authority.
potential_uses: >-
  Network-of-networks knowledge commons, movement archives, federated
  source-system design.
dependencies: >-
  Clear autonomy, multilingual infrastructure, delegation rules, dissent
  records, reciprocal knowledge return, maintenance funding.
tradeoffs: >-
  International summaries can flatten member differences; central archives may
  privilege well-resourced languages and regions.
