title: Public-Commons Partnership Pattern
type: option-entry
category: governance
what_it_is: >-
  Create bounded institutional support relationships between public bodies and
  commoner communities without absorbing the commons into government
  administration.
potential_uses: >-
  Civic infrastructure, municipal partnerships, community assets, local public
  goods.
dependencies: >-
  Clear resource rights, autonomy, accountability, affected-party roles,
  funding, dispute processes.
tradeoffs: >-
  State capture, dependency, unequal access, favoritism, and weak democratic
  accountability.
context: Ghent Commons Transition / Partner State
