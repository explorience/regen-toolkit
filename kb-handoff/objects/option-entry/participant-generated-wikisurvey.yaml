title: Participant-Generated Wikisurvey
type: option-entry
category: governance
what_it_is: >-
  Allow participants to create short statements while voting on others, so the
  issue space evolves rather than remaining fixed by survey designers.
potential_uses: >-
  Large-scale listening, agenda refinement, public consultation, internal
  governance, conflict mapping.
dependencies: >-
  Clear prompt, outreach, moderation, accessible interface, data governance,
  analysis capacity, decision pathway.
tradeoffs: >-
  Statement brevity, self-selection, moderation power, strategic voting, digital
  exclusion, and framing effects can distort results.
