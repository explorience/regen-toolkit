title: Maintenance Readiness Gate
type: option-entry
category: funding-capital
what_it_is: >-
  Require a maintenance plan before treating a project or tool as
  deployment-ready: owners, funding, documentation, repair, security,
  succession, deprecation, and user support.
potential_uses: Toolkit options, technical handoffs, grants, source-system stewardship.
dependencies: >-
  Named maintainers, recurring budget, issue process, documentation, succession
  and shutdown plans.
tradeoffs: >-
  May discourage experiments if applied too rigidly; plans can become
  performative.
