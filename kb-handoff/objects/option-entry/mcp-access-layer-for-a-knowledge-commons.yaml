title: MCP Access Layer for a Knowledge Commons
type: option-entry
category: knowledge-documentation
what_it_is: >-
  Expose reviewed and source-linked knowledge to multiple AI clients through a
  shared Model Context Protocol layer.
potential_uses: >-
  Assistant access, agent workflows, research, contributor support,
  domain-specific query interfaces.
dependencies: >-
  Permissions, source citations, tool boundaries, logging, versioning, context
  limits, review labels.
tradeoffs: >-
  Retrieval can appear authoritative; clients may omit citations or misuse raw
  and restricted records.
