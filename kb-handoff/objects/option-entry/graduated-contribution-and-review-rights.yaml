title: Graduated Contribution and Review Rights
type: option-entry
category: governance
what_it_is: >-
  Separate rights to suggest, add, edit, review, approve public use, publish,
  correct, archive, and appeal.
potential_uses: >-
  Internal collaboration, source-system steward participation, public
  contribution, high-risk record governance.
dependencies: >-
  Role definitions, identity/accountability, decision rules, audit trail,
  conflict resolution.
tradeoffs: >-
  Can create bureaucracy or status hierarchy; overly open rights can reduce
  quality or safety.
