title: Oral Knowledge to Governed Retrieval Workflow
type: option-entry
category: governance
what_it_is: >-
  Convert oral or practice knowledge into retrievable material only through
  community-defined consent, attribution, context, access and withdrawal rules.
potential_uses: >-
  Agroecology memory, Indigenous/community knowledge, implementation memory and
  education.
dependencies: >-
  Community authority, compensation, language stewards, contextual metadata and
  controlled access.
tradeoffs: >-
  High extraction and decontextualization risk; written conversion can freeze
  living knowledge.
