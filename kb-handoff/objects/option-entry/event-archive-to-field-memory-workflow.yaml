title: Event Archive to Field-Memory Workflow
type: option-entry
category: knowledge-documentation
what_it_is: >-
  Convert conference agendas, talks, speaker pages, workshops, demos, and
  post-event material into dated, source-linked concept, claim, relationship,
  and implementation records.
potential_uses: >-
  Media stewardship, research roadmaps, public-goods mechanism comparison,
  civic-tech discovery.
dependencies: >-
  Stable event identifiers, transcripts or recordings, speaker consent/public
  status, editorial review, source-quality labels.
tradeoffs: >-
  Can over-index prominent speakers, strip context, and turn convening
  participation into implied authority.
