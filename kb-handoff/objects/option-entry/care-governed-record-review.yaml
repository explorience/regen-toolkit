title: CARE-Governed Record Review
type: option-entry
category: governance
what_it_is: >-
  Review records involving Indigenous Peoples, lands, cultures, knowledge or
  data through Collective Benefit, Authority to Control, Responsibility and
  Ethics.
potential_uses: >-
  Public-use review, ecological data, AI ingestion, research, registries,
  collections and implementation memory.
dependencies: >-
  Indigenous-led reviewers, community-specific authority, provenance, benefit
  analysis, permissions, correction and withdrawal pathways.
tradeoffs: >-
  Can become performative or checkbox compliance if communities lack decision
  power, compensation or enforcement.
