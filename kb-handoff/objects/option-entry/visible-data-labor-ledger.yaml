title: Visible Data Labor Ledger
type: option-entry
category: governance
what_it_is: >-
  Record the people and forms of labor behind data collection, cleaning,
  annotation, translation, moderation, maintenance, care and review.
potential_uses: >-
  Contributor recognition, compensation, implementation memory and AI dataset
  governance.
dependencies: >-
  Contributor consent, role vocabulary, compensation policy, privacy and
  collective-credit options.
tradeoffs: >-
  May expose precarious workers or turn recognition into surveillance;
  visibility must be optional and safe.
