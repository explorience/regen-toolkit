title: Cooperative ISP with Shared Support Layer
type: option-entry
category: organizational-structure
what_it_is: >-
  Local cooperatives own and operate service while a nonprofit or federation
  provides pooled technical, financial and regulatory capacity.
potential_uses: Community broadband, shared digital infrastructure, cooperative hosting.
dependencies: >-
  Clear authority boundaries, transparent costs, accountability, exit rights and
  local maintenance capacity.
tradeoffs: Support layer may dominate local cooperatives or create dependency.
