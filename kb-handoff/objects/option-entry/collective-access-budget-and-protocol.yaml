title: Collective Access Budget and Protocol
type: option-entry
category: funding-capital
what_it_is: >-
  Attach a funded, revisable access plan to programs, events and technical
  projects, including communication, sensory, mobility, cognitive, remote and
  economic access.
potential_uses: >-
  Funding rounds, residencies, workshops, conferences, working groups and
  product development.
dependencies: >-
  Budget line, access lead, advance communication, remote participation, plain
  language, captions, interpretation, rest and feedback.
tradeoffs: >-
  No protocol can anticipate every need; access conflicts require transparent
  resolution and additional resources.
