title: Access Intimacy without Forced Disclosure
type: option-entry
category: organizational-structure
what_it_is: >-
  Design support and accommodation workflows that reduce repeated explanation
  and unnecessary disclosure while enabling people to communicate changing
  access needs.
potential_uses: >-
  Contributor onboarding, meetings, reviews, event registration and steward
  relationships.
dependencies: >-
  Confidentiality, optional communication methods, trusted access contacts, data
  minimization, responsive budgets.
tradeoffs: >-
  Systems may over-document disability, force diagnostics, or presume access
  needs remain static.
