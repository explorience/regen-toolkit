title: Deliberative Technology Network Model
type: option-entry
category: governance
what_it_is: >-
  Small international community of technologists and deliberative-practice
  experts sharing protocols, research, and implementation knowledge under
  participation and confidentiality rules.
potential_uses: >-
  Field-building, interoperability, good-practice development, research-practice
  exchange.
dependencies: >-
  Credible conveners, balanced membership, clear purpose, participation norms,
  geographic diversity, public outputs, and conflict handling.
tradeoffs: >-
  Invite-only structure may reproduce gatekeeping; Chatham House rules can limit
  public accountability and knowledge return.
