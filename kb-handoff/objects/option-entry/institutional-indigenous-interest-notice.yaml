title: Institutional Indigenous-Interest Notice
type: option-entry
category: knowledge-documentation
what_it_is: >-
  Attach a visible disclosure when a record, dataset or collection may involve
  Indigenous rights or interests but community guidance is not yet resolved.
potential_uses: >-
  Import queues, museum/archive records, research datasets, ecological projects
  and AI corpora.
dependencies: >-
  Standard notice language, contact pathway, provenance, review ownership and
  escalation process.
tradeoffs: >-
  A notice can delay or substitute for actual engagement if not linked to
  accountable follow-up.
