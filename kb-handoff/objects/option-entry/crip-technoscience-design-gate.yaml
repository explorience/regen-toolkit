title: Crip-Technoscience Design Gate
type: option-entry
category: governance
what_it_is: >-
  Ask whether disabled people are designers, governors and maintainers of a
  technology rather than only target users, test subjects or beneficiaries.
potential_uses: >-
  AI, assistive technology, civic tech, data systems, public infrastructure and
  procurement.
dependencies: >-
  Disabled-led design authority, labor compensation, structural analysis,
  deployment safeguards, maintenance and refusal rights.
tradeoffs: Could be misused as a branding label without material transfer of power.
