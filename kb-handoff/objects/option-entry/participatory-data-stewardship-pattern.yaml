title: Participatory Data Stewardship Pattern
type: option-entry
category: governance
what_it_is: >-
  Design data institutions around community participation, value sharing and
  governance rather than unilateral data extraction.
potential_uses: >-
  Community datasets, collaborative AI, urban data, research platforms and
  knowledge commons.
dependencies: >-
  Clear authority, representative processes, legal structure, sustainable
  financing and exit rights.
tradeoffs: >-
  Participation can be symbolic; scaling can centralize power or dilute
  community control.
