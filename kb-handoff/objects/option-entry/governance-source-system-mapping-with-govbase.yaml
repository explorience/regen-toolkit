title: Governance Source-System Mapping with Govbase
type: option-entry
category: governance
what_it_is: >-
  Adapt Govbase-style records for projects, organizations, structures, cases,
  documents, parameters, and governance models into the Toolkit resource graph.
potential_uses: >-
  Governance-tool discovery, structural comparison, standards intake, case
  mapping, and prior-art review.
dependencies: >-
  Shared object vocabulary, source lineage, status dates, stewardship, duplicate
  resolution, and public-use rules.
tradeoffs: >-
