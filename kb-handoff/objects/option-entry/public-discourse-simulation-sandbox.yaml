title: Public Discourse Simulation Sandbox
type: option-entry
category: experimentation
what_it_is: >-
  Use simulated agents, digital twins, and controlled human-bot interactions to
  test facilitation or discourse interventions before wider deployment.
potential_uses: >-
  Research preparation, adversarial testing, facilitator-tool evaluation, AI
