title: Practitioner Network as Distributed Support Infrastructure
type: option-entry
category: organizational-structure
what_it_is: >-
  Use a membership network of organizations, civil servants, researchers, and
  advocates to provide peer learning, mentoring, resource development,
  contracting, and regional collaboration.
potential_uses: >-
  Source-system stewardship, local-node support, contributor pathways, capacity
  building.
dependencies: >-
  Membership criteria, regional structures, compensation, language access,
  conflict handling, decision rights, and public accountability.
tradeoffs: >-
  Can centralize visibility, reproduce professional-network exclusion, or
  over-rely on unpaid member labor.
