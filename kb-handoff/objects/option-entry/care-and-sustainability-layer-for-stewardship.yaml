title: Care and Sustainability Layer for Stewardship
type: option-entry
category: governance
what_it_is: >-
  Treat care, rest, interdependence, conflict support and practitioner
  sustainability as part of governance infrastructure.
potential_uses: >-
  Maintainer roles, reviewer networks, source-system stewardship and community
  moderation.
dependencies: >-
  Material resourcing, workload visibility, boundaries, consent and non-coercive
  participation.
tradeoffs: >-
  Care language may shift responsibility onto individuals or unpaid caregivers
  instead of institutions.
