title: Open-Source Project Transition to Community Accountability
type: option-entry
category: governance
what_it_is: >-
  Develop processes and tooling for open-source projects to define
  accountability systems and transition toward community governance.
potential_uses: >-
  Public-goods software succession, maintainer transitions, contributor
  governance, ownership, and sustainability.
dependencies: >-
  Maintainer and contributor consent, legal structure, governance design,
  funding, maintenance capacity, and conflict processes.
tradeoffs: >-
  Transitions can be symbolic, underfunded, capture-prone, or burdensome for
  already-stretched maintainers.
