title: Food sovereignty is the same as food security
type: claim-evidence
claim: Food sovereignty is the same as food security
interpretation: >-
  Treat food sovereignty as a political framework centered on peoples' authority
  over food and agriculture systems, not as a synonym for food security.
uncertainty: >-
  Food security can focus on availability and access without addressing who
  controls land, seeds, production, trade and policy.
