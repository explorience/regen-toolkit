title: Open-source or civic technology is inherently liberatory
type: claim-evidence
claim: Open-source or civic technology is inherently liberatory
interpretation: >-
  Assess ownership, control, access, labor, harms and institutional context
  rather than inferring justice from openness or civic purpose.
uncertainty: >-
  Tools and design sites can reproduce domination through access barriers, labor
  structures, surveillance, governance and institutional use.
