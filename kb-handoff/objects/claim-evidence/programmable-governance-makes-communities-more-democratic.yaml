title: Programmable governance makes communities more democratic
type: claim-evidence
claim: Programmable governance makes communities more democratic
interpretation: >-
  PolicyKit can help communities author and execute procedures; governance
  quality depends on who writes the rules, who is affected, and how rules are
  challenged.
uncertainty: >-
  The ability to encode procedures does not establish participation quality,
  legitimacy, inclusion, or fair outcomes.
