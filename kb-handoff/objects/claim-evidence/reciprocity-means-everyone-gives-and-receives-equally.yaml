title: Reciprocity means everyone gives and receives equally
type: claim-evidence
claim: Reciprocity means everyone gives and receives equally
interpretation: >-
  Use reciprocity as shared commitment and relationship, not equal exchange at
  every moment.
uncertainty: >-
  People have different capacities, needs, risks and time horizons; strict
  equivalence can exclude disabled, poor or crisis-affected participants.
