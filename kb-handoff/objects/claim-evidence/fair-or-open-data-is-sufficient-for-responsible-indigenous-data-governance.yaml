title: FAIR or open data is sufficient for responsible Indigenous data governance
type: claim-evidence
claim: FAIR or open data is sufficient for responsible Indigenous data governance
interpretation: >-
  Use FAIR together with CARE and community-specific governance; openness is not
  the default goal for all data.
uncertainty: >-
  Findability and reuse can increase extraction or harm when authority, benefit,
  responsibility and ethics are not addressed.
