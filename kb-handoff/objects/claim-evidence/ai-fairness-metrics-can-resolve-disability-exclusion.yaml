title: AI fairness metrics can resolve disability exclusion
type: claim-evidence
claim: AI fairness metrics can resolve disability exclusion
interpretation: >-
  Use disability-led justice review, use-case legitimacy, data minimization,
  subgroup analysis and refusal options in addition to technical metrics.
uncertainty: >-
  Disability is heterogeneous, contextual and often absent or distorted in
  datasets; equalized metrics can preserve harmful uses and medicalized
  assumptions.
