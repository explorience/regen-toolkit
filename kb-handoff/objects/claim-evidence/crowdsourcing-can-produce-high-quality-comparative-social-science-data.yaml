title: Crowdsourcing can produce high-quality comparative social-science data
type: claim-evidence
claim: Crowdsourcing can produce high-quality comparative social-science data
interpretation: >-
  Participedia is an important experiment in structured crowdsourced comparative
  data; quality should be assessed field by field and use by use.
uncertainty: >-
  Structured forms, editorial tending, codebooks, and contributor histories can
  improve quality, but uneven participation and review constrain inference.
