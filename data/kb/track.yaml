entries:
  building-a-minimum-viable-node-8-week-mvn-roadmap:
    title: Building a Minimum Viable Node (8-week MVN roadmap)
    type: track
    audience: regen organizers ready to launch a local node
    starting_context: >-
      An organizer with community energy and prior exposure to other nodes'
      playbooks, facing the temptation to build a token, treasury, governance
      framework, and constitution before anyone can join — the pattern the
      article says burns out good organizers within three months.
    outcome:
      - >-
        A working minimum viable node: a shared one-sentence purpose, a way to
        track value, and five to ten people who reliably show up.
      - >-
        Real signal on whether the idea has legs, gathered in eight weeks
        instead of sunk months.
      - >-
        A concrete trigger table for when (and only when) to add technology —
        ledger software, lightweight roles, Snapshot voting, a Safe multisig —
        so complexity is added because coordination is straining, not to look
        serious.
    concepts:
      - minimum-viable-node
    deployment_checks:
      - shared purpose statable in one sentence by the whole founding crew
      - a way to track value in place (spreadsheet, paper ledger, or hOurworld)
      - five to ten people who show up when it is raining, not just "interested"
    failure_modes:
      - >-
        Planning forever instead of running one real exchange — "this is where
        most nodes die."
      - >-
        Adding blockchain/DAO tooling (token, on-chain governance, legal entity)
        before human coordination has actually started to strain.
      - >-
        Running out of the funding needed to keep the lights on, even with a
        sound model and community support (the Bristol Pound/Bristol Pay
        precedent cited in the article).
      - >-
        Treating heavyweight legacy DAO frameworks (e.g. the older DAOstack/
        Alchemy stack) as a starting line rather than a later destination.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/minimum-viable-node.md
      transformation: synthesized
      authorship: ai-assisted
    work_order: wo-810346fad236
    source_lineage: minimum-viable-node.md
  first-90-days-local-node-playbook:
    title: 'First 90 Days: Local Node Playbook'
    type: track
    audience: aspiring ReFi local-node organizers starting a place-based community
    starting_context: >-
      A city, a handful of interested people, and no treasury, token, or
      incorporated entity yet.
    outcome:
      - >-
        days 1-30 — convene: find people already doing the work, host one small
        gathering (not a conference), reach a named core group of 3-5 people who
        showed up twice
      - >-
        days 31-60 — distribute the work: rotate facilitation and roles (events,
        partnerships, notes) so no single person is load-bearing; run a
        sustainable monthly rhythm
      - >-
        days 61-90 — fund carefully: only pursue funding (e.g. Gitcoin Grants)
        once there's a real group and a track record of a few events
    concepts:
      - local-node
      - quadratic-funding
      - liberating-structures
    options:
      - luma-event-registration
      - gitcoin-grants
      - glo-dollar-treasury
    deployment_checks:
      - >-
        does a named core group of 3-5 repeat attendees exist before any
        incorporation/fundraising step?
      - >-
        are roles (events, partnerships, notes/follow-up) explicitly rotated
        rather than held by one person?
      - >-
        is the funding round (e.g. Gitcoin) walked through with the community
        beforehand (Gitcoin Passport, payout timing, gas fees)?
    failure_modes:
      - >-
        treating the node launch like a product launch (fundraising/token/
        treasury before relationships exist)
      - >-
        one person carrying all coordination work until burnout stalls the node
        (per Commons Social Change Library's burnout research)
      - >-
        fundraising before a track record exists, creating a chicken-and-egg gap
        given multi-month grant payout timelines
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/first-90-days.md
      transformation: synthesized
      authorship: ai-assisted
    work_order: wo-e009425cced2
    source_lineage: first-90-days.md
