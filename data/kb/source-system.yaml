    title: Grassroots Economics (Sarafu Network)
    type: blog
    url: https://www.grassrootseconomics.org/sarafu-network
    steward: Grassroots Economics (Kenyan nonprofit)
    what_it_curates: >-
      Sarafu, a community currency over 50,000 people have used to trade food,
      goods, and services where regular cash/banking is scarce. Works on basic
      phones over USSD; the transaction record lives on a public blockchain so
      the community, not a bank, governs it.
    why_it_matters: >-
      The article's clearest real (non-theoretical) example of Web3 doing
      something ordinary banking cannot: cross-border/no-gatekeeper value
      movement for a mutual-aid/local economy at real scale.
    how_to_credit: unknown — not stated in the article
