  refi-dao:
    title: ReFi DAO
    type: directory
    steward: ReFi DAO core team and its local-node stewards
    return_path: >-
      Local nodes register and can be found via refidao.com/local-nodes; the
      network's own reciprocal touchpoint is a monthly community call (third
      Thursday of each month) that holds the worldwide network together — a node
      contributes back by showing up there and by listing itself in the
      directory rather than operating as an extracted case study.
    url: https://refidao.com
    what_it_curates: >-
      A global directory and coordination layer for local, self-organizing
      regen-finance chapters ("local nodes") running real-world experiments on
      the ground.
    why_it_matters: >-
      It is the article's primary named authority and source for concrete
      examples (ReFi Cape Town's informal-gathering-first approach, the
      third-Thursday global call cadence) used throughout the guide.
