  ai-assisted-classification-for-your-knowledge-commons:
    title: AI-Assisted Classification for Your Knowledge Commons
    type: encyclopedia-entry
    page_type: guide
    summary: >-
      An opinionated guide for small teams on using AI to sort and tag a growing
      document pile without letting it silently invent its own taxonomy.
      Distinguishes typing (what kind of thing) from tagging (what it's about),
      contrasts unsupervised discovery (BERTopic) with supervised bucketing
      (LLMs against a fixed category list), and argues for running discovery
      once to design a taxonomy then constraining all later AI output to an enum
      so the categories stay stable. Closes with a human-in-the-loop discipline:
      store model confidence, stamp provenance on every tag, and never let an AI
      suggestion pass as a settled decision.
    audience: small teams and local nodes running a shared docs/GitHub knowledge base
    known_tensions:
      - >-
        discovery (let the data surprise you) vs bucketing (force answers into a
        fixed list) — article resolves this as "discovery once to design the
        taxonomy, bucketing for everything after."
      - >-
        constrained output (schema/enum-locked classification) prevents taxonomy
        sprawl but also means a genuinely new category needs a deliberate,
        reviewed "new tag" escape hatch rather than silent invention.
    related_concepts:
