  why-measurement-matters-for-your-local-node:
    title: Why Measurement Matters for Your Local Node
    type: encyclopedia-entry
    page_type: guide
    summary: >-
      A practical guide for local-node and chapter builders on measuring impact
      without bureaucracy or burnout: why measurement prevents burnout on
      non-compounding activity, the outputs/outcomes/impact distinction, why in
      Web3 measurement is the funding rail rather than after-the-fact paperwork
      (retroactive funding, attestation, hypercerts), why holding your own
      verified record supports node autonomy, and a start-small honest-reporting
      practice.
    audience: local node and chapter builders
    known_tensions:
      - measurement rigor vs. burnout / bureaucracy risk
      - >-
        node autonomy from a parent DAO/umbrella org vs. needing to report up to
        the network
    related_concepts:
