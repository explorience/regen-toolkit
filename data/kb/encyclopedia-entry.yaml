        most teams only know two verbs, keep and delete — keeping lets the wiki
        silently rot, deleting erases the memory of why a decision was made; the
        article's four-move framework is presented as the fix.
      - >-
        composting requires human judgment (deciding what's worth keeping) while
        archiving and deprecating are described as "near-mechanical" — the
        article treats this as why composting is the most valuable and least
        practiced of the four moves.
