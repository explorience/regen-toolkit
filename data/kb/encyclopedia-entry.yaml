  the-decentralization-spectrum:
    title: The Decentralization Spectrum
    type: encyclopedia-entry
    page_type: framework
    summary: >-
      Frames decentralization as a spectrum rather than a binary. Covers three
      network-architecture types (centralized, decentralized, distributed), four
      governance forms (deconcentration, delegation, devolution, privatization),
      and two cross-cutting dimensions (technological vs. sociopolitical
      decentralization) that must both be evaluated to judge how decentralized a
      system really is. Argues decentralization is a design tool to be tuned to
      context, not an ideology to maximize.
    audience: >-
      individuals building or participating in regenerative systems (beginner
      level)
    known_tensions:
      - >-
        technological-vs-sociopolitical — a system can be technically
        decentralized (many nodes) while power/token concentration keeps real
        control narrow
      - >-
        resilience-vs-decision-speed — fully distributed systems maximize
        resilience but can struggle to make timely decisions
    related_concepts:
      - decentralization
      - subsidiarity
      - polycentric-governance
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/decentralization-spectrum.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-ee62e83173d4
    source_lineage: decentralization-spectrum.md
  wallet-comparison-guide:
    title: Wallet Comparison Guide
    type: encyclopedia-entry
    page_type: comparison
    summary: >-
      A beginner-oriented comparison of four Android crypto wallets (Coinbase
      Wallet, MetaMask, Trust Wallet, Rainbow) on ease of use, feature breadth,
      and blockchain support, plus core wallet concepts (public address vs
      secret/seed phrase), safety tips, and step-by-step first-wallet setup
      instructions tied to a specific program's onboarding flow.
    audience: >-
      complete beginners setting up their first crypto wallet on Android, within
      a specific program's onboarding
    known_tensions:
      - >-
        ease-of-use (Coinbase Wallet) vs feature breadth/Web3-app-compatibility
        (MetaMask)
      - >-
        simplicity for beginners vs the safety burden of self-custody (no bank
        to call if the seed phrase is lost or stolen)
    related_concepts:
      - self-custody-wallets
      - seed-phrase-security
    related_resources:
      - Coinbase Wallet
      - MetaMask
      - Trust Wallet
