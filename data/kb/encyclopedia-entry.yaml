    source_lineage: what-is-refi.md
  gitcoin-grants-and-quadratic-funding:
    title: Gitcoin Grants and Quadratic Funding
    type: encyclopedia-entry
    page_type: guide
    summary: >-
      How quadratic funding distributes a matching pool by counting contributor
      count rather than dollar totals (sum-the-square-roots-then-square
      formula), illustrated with a real regen QF round (GG24's Bioregional
      Reforestation Round), the sybil-defense mechanisms rounds use (Human
      Passport proof-of-personhood, Connection-Oriented Cluster Matching), a
      walkthrough for running your own round on Grants Stack, and burnout
      guardrails for first-time round organizers.
    audience: local node organizers considering running or joining a QF round
    known_tensions:
      - >-
        Live "estimated match" figures move after a round closes as Passport
        eligibility and COCM corrections are applied — organizers are warned not
        to promise applicants an exact payout in advance.
      - >-
        QF amplifies an existing community; it does not conjure one — a round
        run before relationships exist will underperform regardless of mechanism
        design.
    related_concepts:
      - quadratic-funding-formula
    related_resources:
      - grants-stack
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/gitcoin-grants-qf.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-55b29771dc58
    source_lineage: gitcoin-grants-qf.md
  treasury-management-for-daos:
    title: Treasury Management for DAOs
    type: encyclopedia-entry
    page_type: guide
    summary: >-
      Practical guide to DAO treasury management: the "native token problem"
      (thin liquidity, extreme volatility, broken operational continuity when a
      treasury holds mostly its own governance token), the case for holding 2-3
      years of operating expenses in stablecoins, four diversification methods
      (earning stablecoin revenue, strategic token sales, strategic
      partnerships, borrowing against tokens), and Maya Protocol as a
      transitioning-to-DAO-governance example.
    audience: 🌱 Maya (beginner track, DAO governance/finance foundations)
    known_tensions:
      - >-
        diversification improves resilience but strategic token sales and
        borrowing both carry market-impact / liquidation risk
      - >-
        treasury management choices are framed as governance choices (who holds
        power), not purely financial ones
    related_concepts:
      - dao-treasury-diversification
      - native-token-concentration-risk
    related_resources:
      - Maya Protocol
      - Aave
      - Gnosis Auction
    high_risk: true
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/treasury-management.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-6e3dae058f08
    source_lineage: treasury-management.md
  the-funding-landscape:
    title: The Funding Landscape
    type: encyclopedia-entry
    page_type: guide
    summary: >-
      A map of web3 and ReFi-native funding mechanisms for local node builders,
      organized around one axis: prospective funding (grants, quadratic funding)
      that pays before the work happens, versus retrospective funding (RetroPGF
      / Retro Funding, hypercerts) that pays after impact is shown. Also surveys
      direct grants, streaming/recurring funding, yield-based ("evergreen")
      funding, and conviction voting, and closes on Sybil/collusion risk in QF
      and the case for blending funding sources so no single funder sets a
      node's direction.
    audience: local node organizers evaluating funding mechanisms
    known_tensions:
      - >-
        Quadratic funding rewards breadth but is structurally vulnerable to
        Sybil attacks and collusion; every fix (e.g. identity verification via
        Gitcoin Passport/Human Passport) trades away some decentralization for
        integrity.
      - >-
        Retro funding rewards track record, which favors established nodes over
        brand-new ones with no visible output yet.
      - >-
        External/grant funding "often means external priorities entering your
        community space" — the article's own defense is blending sources, not
        avoiding funding.
    related_concepts:
      - quadratic-funding
      - retroactive-public-goods-funding
      - hypercerts
    related_resources:
      - octant
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/funding-landscape.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-704b0ef07811
    source_lineage: funding-landscape.md
  common-crypto-scams-and-how-to-spot-them:
    title: Common Crypto Scams and How to Spot Them
    type: encyclopedia-entry
    page_type: guide
    summary: >-
      A plain-language field guide to the main crypto scam patterns — phishing,
      investment/"guaranteed returns" fraud, romance/"pig butchering" scams, and
      rug pulls — plus the psychological levers (urgency, authority, trust)
      scammers reuse, practical defenses (hardware wallets, 2FA, bookmarked
      URLs, multi-sig for shared funds), and what to do if you've been scammed
      (stop contact, document, report to IC3, alert your community).
    audience: community organisers and newcomers to Web3
    known_tensions:
      - >-
        article notes AI is now used to generate convincing scam content/voices,
        which erodes "professional appearance" as a trust signal
    related_concepts:
      - phishing
      - rug-pull
      - pig-butchering-scam
    maturity: raw
