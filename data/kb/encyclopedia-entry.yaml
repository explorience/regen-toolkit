entries:
  what-is-decentralization:
    title: What Is Decentralization?
    type: encyclopedia-entry
    page_type: concept
    summary: >-
      A plain-language guide to decentralization for community organizers and
      permaculturists new to crypto: what it means, why it matters for their
      existing work (local chapters, volunteer coordination, shared treasuries),
      how it's a spectrum rather than a binary, and how to spot genuine versus
      hyped decentralization using free/open/fair criteria plus concrete tools
      (Snapshot, quadratic voting).
    audience: community organizers and permaculturists new to crypto
    known_tensions:
      - >-
        openness of infrastructure vs. concentration of day-to-day decision
        power
    related_concepts:
      - decentralization
    related_resources:
      - 1Hive
      - Snapshot (snapshot.org)
    maturity: raw
    public_use: source-linked-unreviewed
    ai_assisted: true
    provenance:
      origin: src/content/docs/what-is-decentralization.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-0f39787ee74e
    source_lineage: what-is-decentralization.md
  a-tools-directory-for-knowledge-that-outlives-turnover:
    title: A Tools Directory for Knowledge That Outlives Turnover
    type: encyclopedia-entry
    page_type: guide
    summary: >-
      An opinionated, named-tool guide for building a team knowledge commons
      that survives contributor turnover. Organized around one governing
      principle ("infrastructure should follow function") and one portability
      test ("would your knowledge survive the tool dying?"), it maps tool
      choices to jobs (team knowledge base, individual notes, public site) and
      names a public/internal/private visibility-tier substrate mapping.
    audience: small teams and local nodes choosing knowledge-commons tooling
    known_tensions:
      - >-
        Polished, collaboration-friendly tools (Notion) vs. durable,
        portable-in-plain-text tools (Markdown + Git) — the article resolves
        this as "own your source of truth in plain text and Git; use everything
        else as a publishing or collaboration layer on top."
      - >-
        Even historically file-based tools can drift away from portability —
        Logseq's 2025-2026 SQLite-backed "DB version" is cited as a caution that
        "file-on-disk" is a property to keep checking, not assume.
    related_concepts:
      - infrastructure-follows-function
    related_resources:
      - obsidian
      - quartz
      - astro-starlight
      - bookstack
      - outline
      - wiki-js
      - gitbook
      - notion
      - logseq
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/knowledge-tools-directory.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-205d26f8a05e
    source_lineage: knowledge-tools-directory.md
  the-gatherings-pattern:
    title: The Gatherings Pattern
    type: encyclopedia-entry
    page_type: framework
    summary: >-
      A five-element framework (Purpose, People, Place, Process, Practice) for
      designing intentional gatherings for local nodes, plus four ready-made
      gathering formats (Onboarding, Governance, Trust-Building, Learning) and
      five cross-cutting hosting principles. Framed as the primary way local
      nodes build the trust and shared understanding that community finance
      systems require.
    audience: local node organizers / community hosts
    known_tensions:
      - >-
        "Don't default to everyone's invited" small-curated-group guidance vs.
        the inclusive, open-participation norms many decentralized communities
        hold as a default.
      - >-
        Generous authority (a single host holding structure) vs. anti-hierarchy
        instincts in horizontally-organized communities.
    related_concepts:
      - purpose-people-place-process-practice
    related_resources:
      - the-art-of-gathering
      - liberating-structures
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/gatherings-pattern.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-3432cf7d500b
    source_lineage: gatherings-pattern.md
  federation-and-portability-building-a-commons-that-outlives-its-tools:
    title: 'Federation and Portability: Building a Commons That Outlives Its Tools'
    type: encyclopedia-entry
    page_type: framework
    summary: >-
      Argues that a knowledge commons needs both portability (moving your data
      between tools/people/orgs without rot) and federation (sharing across
      groups without merging into one database). Recommends a "portability
      floor" of plain Markdown in Git (readable, diffable, greppable,
      vendor-independent) with structure kept in frontmatter, then layers
      federation on top via named public/internal/private boundaries and stable
      references — from ad hoc shared folders up to protocols like KOI-net
      (RIDs) or ActivityPub (Mastodon).
    audience: small-team leads who work in docs/GitHub but aren't ontologists
    known_tensions:
      - >-
        protocol-maturity-gap — ActivityPub/Mastodon federates social identity
        well but, as of 2025, doesn't yet portable-move actual post content
    related_concepts:
      - portability
      - federation
      - reference-identifier-rid
    related_resources:
      - obsidian
      - koi-net
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/federation-portability.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-4e11e89a5db3
    source_lineage: federation-portability.md
  what-is-a-crypto-wallet:
    title: What Is a Crypto Wallet?
    type: encyclopedia-entry
    page_type: concept
    summary: >-
      A plain-language guide to crypto wallets for community organizers and
      permaculturists new to Web3: the "wallet holds keys, not money"
      distinction, public vs. private keys, recovery phrases and their
      single-point-of-failure risk, newer passkey/guardian-based smart-wallet
      recovery, hot vs. cold wallet trade-offs, energy-use context, and named
      scam patterns.
    audience: community organisers and permaculturists new to Web3
    known_tensions:
      - convenience (hot wallet) vs. security (cold wallet)
      - >-
        classic recovery-phrase model (full user responsibility, no recourse)
        vs. smart-wallet guardian recovery (friendlier, newer, less
        battle-tested)
    related_concepts:
      - crypto-wallet-keys-not-money
    related_resources:
      - Giveth
      - MetaMask
      - Smart wallets with passkey/guardian recovery (Base App, Argent "Ready")
      - Hardware / cold wallets (Ledger, Trezor)
    maturity: raw
    public_use: source-linked-unreviewed
    ai_assisted: true
    provenance:
