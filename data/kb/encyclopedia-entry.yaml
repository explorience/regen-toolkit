  case-studies-how-nonprofits-are-using-web3:
    title: 'Case Studies: How Nonprofits Are Using Web3'
    type: encyclopedia-entry
    page_type: case-linked
    summary: >-
      Surveys real-world nonprofit adoption of crypto: Ukraine's 2022 emergency
      crypto fundraising after banks froze, Mercy Corps Ventures cutting
      delivery costs 60% with stablecoins in Syria, and the fast growth of
      crypto donations reported by The Giving Block. Frames web3 tools as
      practical infrastructure (fast settlement, transparency, lower
      cross-border fees) rather than a speculative novelty, and gives small
      nonprofits a low-effort on-ramp (accept crypto donations, use stablecoins
      for cross-border payments, use blockchain records for transparent
      reporting).
    audience: nonprofit staff and small charity operators new to crypto
    known_tensions:
      - >-
        article leans on cited statistics from interested parties (The Giving
        Block, CryptoAltruists) without independent verification
    related_concepts:
