    work_order: wo-7d08281b2f7e
    source_lineage: common-scams.md
  ontology-vs-taxonomy-which-one-does-your-commons-need:
    title: 'Ontology vs Taxonomy: Which One Does Your Commons Need?'
    type: encyclopedia-entry
    page_type: comparison
    summary: >-
      A plain-language guide for teams building a knowledge commons: a taxonomy
      is a labelled filing cabinet (hierarchy of categories, preferred/alternate
      labels, broader/narrower/related relations) for browsing and finding
      things; an ontology adds typed classes, individuals, and named
      relationships that let software infer facts (e.g. flagging a missing
      report). The practical heuristic: taxonomy first, ontology only when a
      specific, recurring task needs machine reasoning over relationships. SKOS
      is offered as the bridge that keeps the door to an ontology open without
      wasted work.
    audience: >-
      small-team leads building a knowledge commons who are comfortable in
      docs/GitHub but not ontologists
    known_tensions:
      - >-
        taxonomy-vs-ontology scope creep — promoting every useful tag to a
        structural type balloons the model (ontology sprawl)
      - >-
        classification (taxonomy) vs. machine-reasoning (ontology) are often
        conflated in practice
    related_concepts:
      - taxonomy
      - ontology
      - SKOS
    related_resources:
      - SKOS (W3C standard)
      - Protégé (ontology editor)
      - Schema.org
      - Wikidata
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/ontology-vs-taxonomy.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-7fb26c01e3dc
    source_lineage: ontology-vs-taxonomy.md
  source-systems-knowledge-that-outlives-turnover:
    title: 'Source Systems: Knowledge That Outlives Turnover'
    type: encyclopedia-entry
    page_type: concept
    summary: >-
      Defines a "source system" as a living knowledge environment (wiki, repo,
      forum, garden…) rather than a one-off link — one that has a steward, keeps
      getting new material added, and offers a return path to credit and trace
      claims back to their origin. Contrasts this with a static "link list" that
      rots. Ties provenance (recorded origin/history) to the principle
      "inclusion does not mean endorsement," gives real named tools (Obsidian,
      Logseq, TiddlyWiki, CITATION.cff, ADR/MADR) that already encode these
      properties, and frames stewardship of a source system as a governance
      problem (Ostrom's commons-design principles), not just tidying.
    audience: >-
      small-team leads maintaining wikis/repos/knowledge bases who want them to
      survive contributor turnover
    known_tensions:
      - >-
        add-broadly-classify-lightly (low friction intake) vs.
        mark-maturity-honestly (don't let raw material pass as endorsed)
      - >-
        a link list is easy to start and cheap to maintain; a source system
        requires an actual steward and return path, which is more work up front
    related_concepts:
      - source-system
      - provenance
      - digital-garden
    related_resources:
      - Obsidian
      - Logseq
      - TiddlyWiki
      - Citation File Format (CITATION.cff)
    maturity: raw
    ai_assisted: true
    provenance:
