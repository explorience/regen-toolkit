entries:
  decentralization-is-a-spectrum-not-a-binary-switch:
    title: Decentralization is a spectrum, not a binary switch
    type: claim-evidence
    claim: >-
      Almost nothing is fully decentralized, and that's fine — most real-world
      systems (crypto and non-crypto) sit somewhere on a spectrum rather than
      being purely centralized or purely decentralized.
    evidence: >-
      Article's own examples: a community garden may have a small steering group
      handling the calendar/bank account while every gardener decides freely
      what to grow in their plot; a crypto project may keep a fully open,
      tamper-proof public ledger while day-to-day decisions still flow through a
      handful of founders. Both are presented as normal hybrids, not failures.
    source_lineage: src/content/docs/what-is-decentralization.md
    interpretation: >-
      Reframes the useful diagnostic question away from "is this decentralized,
      yes or no?" toward "who holds power here, over what, and could they abuse
      it?" — used by the article to help a non-crypto-native audience evaluate
      real projects without treating "decentralized" as a binary marketing
      claim.
    uncertainty: >-
      Illustrative framing from a plain-language guide, not a formal/quantified
      study of decentralization spectra; no named methodology or dataset behind
      the claim.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/what-is-decentralization.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-0f39787ee74e
  priya-parker-on-structure-and-hosting-spirit-in-gatherings:
    title: Priya Parker on structure and hosting spirit in gatherings
    type: claim-evidence
    claim: >-
      "Gatherings crackle and flourish when real thought goes into them, when
      (often invisible) structure is baked into them, and when a host has the
      curiosity, willingness, and generosity of spirit to try."
    evidence: >-
      Direct quotation attributed to Priya Parker, "The Art of Gathering: How We
      Meet and Why It Matters" (Riverhead Books, 2018), as cited in the
      article's References.
    source_lineage: src/content/docs/gatherings-pattern.md
    interpretation: >-
      Used in the article as the founding rationale for treating gatherings as
      an intentional design challenge rather than a default "find a venue, post
      an invite" script.
    uncertainty: >-
      Quote reproduced as given in the article; page/edition location within the
      book was not independently verified for this ingestion.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/gatherings-pattern.md
      transformation: quoted
      authorship: ai-assisted
    work_order: wo-3432cf7d500b
  koi-net-reached-public-beta-in-may-2025-and-is-actively-maintained:
    title: KOI-net reached public beta in May 2025 and is actively maintained
    type: claim-evidence
    claim: >-
      KOI-net, the network protocol and Python framework implementing RID-based
      federation, hit public beta in May 2025, is MIT-licensed, and is actively
      maintained (v2.0.7 as of May 2026, per `koi-net` on GitHub).
    evidence: Cited to the BlockScience/koi-net GitHub repository.
    source_lineage: https://github.com/BlockScience/koi-net
    interpretation: >-
      Supports the article's framing of KOI-net as a credible, currently-usable
      protocol option (not vaporware) for teams ready to move beyond ad hoc
      "federate by hand" sharing.
    uncertainty: >-
      Version/maintenance status was not independently re-checked against the
      live repository at ingestion time; verify current version before citing
      externally.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/federation-portability.md
      transformation: quoted
      authorship: ai-assisted
    work_order: wo-4e11e89a5db3
  activitypub-mastodon-federates-followers-but-not-post-content-as-of-2025:
    title: ActivityPub/Mastodon federates followers but not post content (as of 2025)
    type: claim-evidence
    claim: >-
      Mastodon's account-migration `Move` activity carries a user's followers
      (and, via exported CSV, their follows) to a new server, but as of 2025 the
      actual posts do not move automatically; true content portability is still
      being specified via the W3C Social Web Community Group's data-portability
      draft and the LOLA proposal.
    evidence: >-
      Cited to Mastodon's own migration documentation and the W3C SWICG
      data-portability draft.
    source_lineage: >-
      https://docs.joinmastodon.org/user/moving/ ;
      https://swicg.github.io/activitypub-data-portability/
    interpretation: >-
      Used as the article's "honest caveat" example — showing that even a
      working, widely-adopted federation protocol (ActivityPub) has an
      incomplete portability story, to temper expectations that adopting a
      protocol instantly solves portability too.
    uncertainty: >-
      Standards work (W3C SWICG draft, LOLA) is explicitly in-progress and may
      have moved since the article's writing; status should be re-checked before
      being cited as current.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/federation-portability.md
      transformation: summarized
      authorship: ai-assisted
    notes: |
      # assessed-but-excluded
      - "The Order That Saves You" 4-step sequence and the "Try This" prompts —
        operational/coaching guidance, not distinct knowledge objects; captured
        at summary level in the encyclopedia-entry instead of split out.
      - Xebia blog post (Markdown+Git case for docs) — a one-off supporting
        citation, not a living knowledge environment the toolkit will keep
        drawing from; not registered as its own source-system.
    work_order: wo-4e11e89a5db3
  no-legitimate-service-ever-asks-for-your-recovery-phrase:
    title: No legitimate service ever asks for your recovery phrase
    type: claim-evidence
    claim: >-
      Anyone who reads your recovery phrase controls your wallet completely,
      with no bank to call and no fraud department to reverse a theft — and the
      single rule that defends against nearly every newcomer scam is that no
      legitimate wallet, exchange, or "support agent" will ever ask you to type
      or share it.
    evidence: >-
      Article names three recurring scam patterns as evidence: (1) fake support
      agents claiming an account is "frozen" and requesting the recovery phrase
      to "fix" it; (2) "free-money bait" posts that publicly share a wallet's
      recovery phrase, tricking people into importing it and draining their own
      funds instead; (3) lookalike sites/apps, near-perfect copies of real
      wallets built to capture what's typed.
    source_lineage: src/content/docs/what-is-wallet.md
    interpretation: >-
      Positioned as the single highest-leverage safety rule in the article —
      "hold that one line and you've avoided most of the danger" — because it
      covers all three named scam vectors at once.
    uncertainty: >-
      General security guidance stated as settled fact in a plain-language
      guide; no incidence statistics or named source cited for how common each
      scam pattern is.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/what-is-wallet.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-553392f77839
  paper-is-no-longer-a-sufficient-recovery-phrase-backup:
    title: Paper is no longer a sufficient recovery-phrase backup
    type: claim-evidence
    claim: >-
      Faded ink, fire, flood, and simple misplacement now rank among the leading
      causes of permanently lost crypto, so paper alone is no longer considered
      a sufficient backup for a recovery phrase.
    evidence: >-
      Stated in the article's "Going deeper" callout, which recommends
      steel-plate backups (brands named: Cryptosteel, Billfodl) stored in a
      second, separate location, plus notes that newer passkey/guardian-based
      smart wallets (Base App, Argent "Ready") now offer an alternative to paper
      backups entirely.
    source_lineage: src/content/docs/what-is-wallet.md
    interpretation: >-
      Used to justify recommending steel backups and/or smart-wallet recovery
      over plain paper, without dismissing paper as unusable, only as
      insufficient on its own for anything the reader would be upset to lose.
    uncertainty: >-
      No cited statistics or named study on lost-crypto causes; the claim reads
      as accepted community wisdom in the source article rather than a sourced
      figure.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/what-is-wallet.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-553392f77839
  toucan-accounts-for-85-of-digital-carbon-credit-volume:
    title: Toucan accounts for ~85% of digital carbon-credit volume
    type: claim-evidence
    claim: >-
      Toucan now accounts for roughly 85% of all digital carbon credits and has
      supported around $4 billion in trading volume, working alongside
      established standards bodies like Gold Standard and Puro.earth.
    evidence: >-
      Stated directly in the source article as a scale figure for Toucan
      Protocol, without an inline citation to a specific report or dashboard.
    source_lineage: src/content/docs/what-is-refi.md
    interpretation: >-
      Used by the article to establish Toucan as the dominant infrastructure for
      carbon-credit tokenization before pivoting to the Verra retired-credit
      controversy — i.e. scale is presented alongside a caution about quality,
      not as an unqualified endorsement.
    uncertainty: >-
      No primary source or date-stamped figure is cited in the article for the
      85% / $4B numbers; not independently verified here. Carbon-market volume
      figures are also known to shift quickly and to be reported inconsistently
      across trackers.
    high_risk: true
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/what-is-refi.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-55907730d33f
  verra-banned-tokenizing-already-retired-carbon-credits-2023:
    title: Verra banned tokenizing already-retired carbon credits (2023)
    type: claim-evidence
    claim: >-
      In 2023 the standards body Verra banned converting already-retired carbon
      credits into tokens, after critics showed many tokenized credits were tied
      to old, low-quality projects that weren't genuinely helping the climate;
      the industry is now working toward an "immobilize, don't double-count"
      approach instead.
    evidence: >-
      Stated in the source article as historical/regulatory context for Toucan
      and the broader carbon-tokenization space; article links to Toucan's own
      blog response to Verra's announcement as a reference.
    source_lineage: src/content/docs/what-is-refi.md
    interpretation: >-
      Article uses this as its central "honest part" — the concrete greenwashing
      cautionary example backing its claim that "tokenizing something does not
      automatically make it good."
    uncertainty: >-
      Presented from the source article's summary and Toucan's own
      response-to-Verra post (one interested party's framing); the underlying
      Verra policy text and independent reporting on the episode were not
      reviewed directly here.
    high_risk: true
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/what-is-refi.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-55907730d33f
  gg24-bioregional-reforestation-round-scale:
    title: GG24 Bioregional Reforestation Round scale
    type: claim-evidence
    claim: >-
      In GG24 (the round Gitcoin ran October 14-28, 2025 as the first round of
      its "Gitcoin 3.0" relaunch), the Bioregional Reforestation Round carried a
      $100,000 matching pool spread across nine bioregions, including Nigeria,
      Kenya/Uganda, Cascadia, and the Mediterranean Coast, with roughly 1,286
      unique donors making about 3,042 donations, and co-funders including
      CeloPG, the Ethereum Foundation, the Climate Coordination Network, and the
      BioFi Project.
    evidence: >-
      Cited in the article's References to "Gitcoin Grants 24 (GG24)"
      (https://gitcoin.co/campaigns/gitcoin-grants-24-gg24) and "Bioregional
      Reforestation Round"
      (https://gov.gitcoin.co/t/bioregional-reforestation-round/24927).
    source_lineage: src/content/docs/gitcoin-grants-qf.md
    interpretation: >-
      Used in the article as proof that quadratic funding already routes real
      money to on-the-ground regenerative work, not just crypto infrastructure —
      offered as the concrete case a local node running tree-planting, food
      sovereignty, or watershed work could look to.
    uncertainty: >-
      Donor/donation counts are approximate ("roughly," "about") as reported in
      the article's cited sources; not independently re-verified for this
      ingestion.
    high_risk: true
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/gitcoin-grants-qf.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-55b29771dc58
  gitcoin-s-two-layer-sybil-defense-human-passport-and-cocm:
    title: Gitcoin's two-layer sybil defense — Human Passport and COCM
    type: claim-evidence
    claim: >-
      Gitcoin QF rounds defend against sybil attacks in two main ways: proof of
      personhood via Human Passport (formerly Gitcoin Passport, acquired by the
      Holonym Foundation in February 2025), which scores donors before their
      contribution counts toward matching; and post-round correction via
      Connection-Oriented Cluster Matching (COCM), which dials down the match
      for donor clusters that always co-donate together.
    evidence: >-
      Cited in the article's References to "Human Passport (formerly Gitcoin
      Passport)"
      (https://human.tech/blog/from-gitcoin-passport-to-human-passport-we-re-now-part-of-human-tech)
      and "Leveling the Field: Connection-Oriented Cluster Matching"
      (https://www.gitcoin.co/blog/leveling-the-field-how-connection-oriented-cluster-matching-strengthens-quadratic-funding).
    source_lineage: src/content/docs/gitcoin-grants-qf.md
    interpretation: >-
      Presented as the two things a round organizer must understand before
      running a round, because final allocations move after donations close as
      these corrections are applied.
    uncertainty: >-
      Acquisition date and mechanism descriptions as reported in the cited
      Gitcoin/Human Passport sources; not independently re-verified.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/gitcoin-grants-qf.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-55b29771dc58
