  recommendation-hold-2-3-years-of-operating-expenses-in-stablecoins:
    title: 'Recommendation: hold 2-3 years of operating expenses in stablecoins'
    type: claim-evidence
    claim: >-
      "The most practical solution: maintain 2-3 years of operating expenses in
      stablecoins like USDC or DAI" as a DAO treasury's survival buffer through
      bear markets.
    evidence: >-
      Argued from the four stated benefits (resilience during downturns,
      predictable budgeting, contributor flexibility, yield/credit
      opportunities) — no external study, dataset, or named DAO case is cited to
      support the specific "2-3 years" figure.
    source_lineage: src/content/docs/treasury-management.md
    interpretation: >-
      This is a concrete financial/governance recommendation a reader could act
      on directly (how much of a DAO's treasury to hold, and in what form) — the
      kind of guidance that materially affects a DAO's finances and
      decision-making power if followed uncritically.
    uncertainty: >-
      The "2-3 years" figure is presented as a rule of thumb without supporting
      data or named precedent; appropriate runway depends heavily on a specific
      DAO's burn rate, revenue, and risk tolerance.
    high_risk: true
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/treasury-management.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-6e3dae058f08
  refi-dao-s-2024-grassroots-funding-distribution-to-local-nodes:
    title: ReFi DAO's 2024 grassroots funding distribution to Local Nodes
    type: claim-evidence
    claim: >-
      ReFi DAO distributed over $236,000 to grassroots communities, including
      its Local Nodes, through 2024 funding rounds, and ran a Local Node
      Incubator that put more than 100 participants through a 13-session
      program.
    evidence: >-
      Cited in the article's References to "ReFi DAO, Local Nodes Showcase 2024"
      (https://blog.refidao.com/refi-local-nodes-showcase-2024/); no
      primary-source figures were independently re-verified for this ingestion.
    source_lineage: src/content/docs/funding-landscape.md
    interpretation: >-
      Framed in the article as evidence that direct grants are "where most local
      nodes actually get their first money," ahead of more exotic on-chain
      mechanisms.
    uncertainty: >-
      Figures are as reported by ReFi DAO's own blog post (secondary citation,
      not independently verified); "over $236,000" is the article's exact
      wording, not a re-derived total.
    high_risk: true
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/funding-landscape.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-704b0ef07811
  gitcoin-passport-s-sybil-influence-reduction-and-its-centralization-trade-off:
    title: >-
      Gitcoin Passport's Sybil-influence reduction and its centralization
      trade-off
    type: claim-evidence
    claim: >-
      Gitcoin Passport (now Human Passport) scoring cut Sybil influence in
      quadratic-funding rounds by roughly 90%, but introduced acknowledged
      points of centralization, including reliance on Gitcoin's own identity
      tooling.
    evidence: >-
      Cited in the article's References to "Gitcoin, Sybil Resistance in
      Quadratic Funding"
      (https://gitcoin.co/research/quadratic-funding-sybil-resistance) and "How
      to Attack and Defend Quadratic Funding"
      (https://www.gitcoin.co/blog/how-to-attack-and-defend-quadratic-funding).
    source_lineage: src/content/docs/funding-landscape.md
    interpretation: >-
      Used in the article as the concrete illustration of its stated principle
      that "every fix for Sybil resistance trades away some decentralisation for
      integrity."
    uncertainty: >-
      The ~90% figure is as reported in Gitcoin's own research post (secondary
      citation, not independently re-derived here).
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/funding-landscape.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-704b0ef07811
  us-crypto-related-losses-reported-to-the-fbi-hit-9-3b-in-2024:
    title: US crypto-related losses reported to the FBI hit $9.3B in 2024
    type: claim-evidence
    claim: >-
      Victims reported $9.3 billion in crypto-related losses to the FBI in 2024,
      a 66% jump from the year before; investment fraud was the single largest
      category at $5.8 billion.
    evidence: >-
      FBI 2024 Internet Crime Report (IC3), cited by URL in the article's
      references.
    source_lineage: >-
      FBI 2024 Internet Crime Report (IC3) —
      https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf
    interpretation: >-
      Used to establish stakes before walking through specific scam types;
      investment-fraud share motivates the article's dedicated "too-good-to-be-
      true returns" section.
    uncertainty: >-
      FBI IC3 figures rely on victim self-reporting, which undercounts actual
      losses (many victims don't report). Not independently re-verified against
      the source PDF here.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/common-scams.md
      transformation: quoted
      authorship: ai-assisted
    work_order: wo-7d08281b2f7e
  taxonomy-first-ontology-later-the-strong-default-for-small-team-commons:
    title: Taxonomy first, ontology later — the strong default for small-team commons
    type: claim-evidence
    claim: >-
      "For a team your size, the strong default is: ship a SKOS taxonomy now,
      and only reach for an ontology when a specific, recurring task can't be
      done by hand." Ask one question to decide: does anything need to reason
      over your relationships, or do humans just need to find things?
    evidence: >-
      Cited to SGKG's framing (taxonomy-as-classification vs. ontology-as-
      relationships, and how they layer) and Hedden Information Management's
      breakdown of the SKOS/OWL standards landscape; illustrated with
      Wikipedia's category system and Schema.org as taxonomy-scale examples vs.
      Wikidata as an ontology-scale example.
    source_lineage: >-
      src/content/docs/ontology-vs-taxonomy.md ([SGKG], [HEDDEN], [SCHEMA],
      [WIKIDATA] references)
    interpretation: >-
      A practical decision heuristic for the Regen Toolkit's own Layer 1
      (Ontology & Semantic Kernel) posture, which the article explicitly quotes:
      "not to create a perfect ontology before use" but enough shared meaning to
      avoid silently incompatible categories.
    uncertainty: >-
      This is editorial guidance from a knowledge-site article, not a
      peer-reviewed study — reasonable as a heuristic, not a proven rule for
      every commons.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/ontology-vs-taxonomy.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-7fb26c01e3dc
  grassroots-economics-sarafu-network-scaled-from-vouchers-not-a-token-launch:
    title: >-
      Grassroots Economics' Sarafu network scaled from vouchers, not a token
      launch
    type: claim-evidence
    claim: >-
      Grassroots Economics (the Kenyan nonprofit behind the Sarafu network) did
      not launch with a token economy — Sarafu began as community members
      issuing simple vouchers, and only migrated onto the Celo blockchain after
      the model had proven itself on the ground. The network now supports tens
      of thousands of small businesses across Kenya, Cameroon, and South Africa;
      in a 2025 survey of active users, 95% said the network is important or
      very important to their household economy.
    evidence: >-
      Cited in the article's References to "Grassroots Economics, Sarafu
      Network" (https://www.grassrootseconomics.org/sarafu-network), "Why Celo"
      (https://www.grassrootseconomics.org/celo-ge), and "2025 Sarafu Network
      Study Results"
      (https://grassecon.substack.com/p/2025-sarafu-network-study-results).
    source_lineage: src/content/docs/minimum-viable-node.md
    interpretation: >-
      Used in the article as the concrete real-world example of "earning your
      way onto a blockchain" — the technology as an upgrade to a working
      community practice, never a substitute for it.
    uncertainty: >-
      Figures (survey percentage, business counts, country coverage) as reported
      in Grassroots Economics' own materials; not independently re-verified for
      this ingestion.
    high_risk: true
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/minimum-viable-node.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-810346fad236
  bristol-pound-and-bristol-pay-wound-down-for-lack-of-funding-not-a-flawed-idea:
    title: >-
      Bristol Pound and Bristol Pay wound down for lack of funding, not a flawed
      idea
    type: claim-evidence
    claim: >-
      The Bristol Pound ran a respected local currency in the UK for nearly a
      decade and still wound down in 2020-2021, not because the idea was wrong,
      but because the organization couldn't secure the funding to keep the
      lights on. Its successor, Bristol Pay, tried to carry the mission forward
      in digital form and was itself discontinued in 2023, again for lack of
      funding.
    evidence: >-
      Cited in the article's References to "Bristol Pound (Wikipedia)"
      (https://en.wikipedia.org/wiki/Bristol_pound).
    source_lineage: src/content/docs/minimum-viable-node.md
    interpretation: >-
      Used in the article as a sustainability cautionary tale — the takeaway
      given is "design for sustainability from week one," not "don't bother."
    uncertainty: >-
      Sourced to a single tertiary reference (Wikipedia); dates and cause of
      discontinuation not independently cross-checked against primary sources
      for this ingestion.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/minimum-viable-node.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-810346fad236
  commons-governance-principles-ostrom-apply-to-source-system-stewardship:
    title: Commons governance principles (Ostrom) apply to source-system stewardship
    type: claim-evidence
    claim: >-
      A source system that no one is allowed to govern eventually gets trashed
      or abandoned; Ostrom's commons-design principles — clearly defined
      boundaries (who may use/change the resource) and graduated sanctions
      (proportionate responses to rule-breaking) — translate directly into "who
      can edit/add/delete" and "how to handle a contributor who keeps adding
      unsourced claims."
    evidence: >-
      Cites Elinor Ostrom's Nobel-winning work on common-pool resource
      governance (P2P Foundation summary of her eight design principles) and the
      Token Engineering Commons' "Cultural Build," which explicitly builds on
      those same eight principles.
    source_lineage: src/content/docs/source-systems.md ([P2P], [TEC] references)
    interpretation: >-
      Frames source-system stewardship as fundamentally a social/governance
      problem, not a tooling problem — "tools store the knowledge; stewards keep
      it trustworthy."
    uncertainty: >-
      The application of Ostrom's principles (developed for physical common-pool
