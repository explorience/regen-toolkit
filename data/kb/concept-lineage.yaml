  claim-evidence-discipline:
    title: Claim-Evidence Discipline
    type: concept-lineage
    short_description: >-
      Keeping the assertion, the source for it, the interpretation, and the
      uncertainty as distinct, separately reviewable things, so a reviewer can
      verify a page's factual claims rather than just admiring its prose.
    source_traditions:
      - >-
        the Regen Toolkit / Regen Knowledge Commons's own claim-evidence
        discipline (named directly in the article as "the Regen docs call this
        claim-evidence discipline")
      - Wikipedia's Good Article citation and verifiability standards
      - academic citation practice (claims requiring inline, checkable sources)
    toolkit_usage: >-
      Positioned in this article as the discipline that makes a commons
      trustworthy over time, operationalized via a reviewer "spot-check" —
      pulling a sample of citations and confirming each source actually supports
      the sentence it's attached to, mirroring Wikipedia's Good Article process.
    adjacent_meanings:
      - >-
        claim-evidence separation as a formal knowledge-schema pattern (this
        toolkit's own claim-evidence schema/object type)
      - >-
        claim-evidence separation as an informal editorial habit (this article's
        practical framing — "pull three citations and verify")
    important_distinctions:
      - >-
        well-written-vs-reviewed — the article's central distinction: prose
        quality and factual accuracy are separate axes, and claim-evidence
        discipline is specifically how you check the second one.
      - >-
        full-citation-audit-vs-spot-check — the article recommends a sampling
        spot-check (a few citations, not every one) as the practical,
        sustainable version of full verification.
    tensions:
      - >-
        reviewer-time-cost vs thoroughness — a full citation audit of every
        claim would be prohibitively slow for small teams; the spot-check is an
        explicit trade-off the article endorses rather than treats as a
        compromise.
    risks_of_flattening: >-
      Treating "it has a citation" as equivalent to "it has been verified"
      flattens the article's whole point — a citation that doesn't actually
      support its attached sentence is exactly the failure mode the spot-check
      step exists to catch.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/editorial-workflow.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-379fb55cc1a6
    source_lineage: editorial-workflow.md
  seed-phrase-bip39-hd-derivation:
    title: Seed Phrase (BIP39 / HD Derivation)
    type: concept-lineage
    short_description: >-
      A 12- or 24-word mnemonic, generated per the BIP39 standard from a random
      number and a fixed 2,048-word list, that acts as the master backup for a
      wallet's private keys and addresses across every BIP39-compatible chain
      and wallet app.
    source_traditions:
      - >-
        BIP39 (Bitcoin Improvement Proposal 39) — the cross-wallet standard
        defining the wordlist and phrase-generation/checksum rules.
      - >-
        Hierarchical deterministic (HD) wallet derivation — the design that lets
        one phrase regenerate every private key and address beneath it.
    toolkit_usage: >-
      Used in the article as the foundational self-custody concept: back up the
      phrase once, and it can rebuild every key/address on every chain that
      follows the standard.
    adjacent_meanings:
      - Secret Recovery Phrase (MetaMask's term)
      - mnemonic phrase
    important_distinctions:
      - >-
        Seed phrase vs private key vs address: the article is explicit that the
        chain runs phrase -> private keys -> addresses; the phrase is the single
        backup point for all of them, not a stand-in for a private key.
      - >-
        12-word (128-bit entropy) vs 24-word (256-bit entropy) phrases — both
        considered unguessable; 24 words framed as a preference for larger
        treasuries/long-term holdings, not a security requirement.
    tensions:
      - >-
        One phrase controlling many chains is simultaneously the feature (no
        per-chain backups) and the risk (single point of compromise for
        everything at once).
    risks_of_flattening: >-
      Treating "seed phrase" as interchangeable with "password" undersells that
      there is no reset mechanism at all — the article stresses this is a
      categorical difference from conventional account recovery.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/seed-phrases.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-38c3e2b4e44f
    source_lineage: seed-phrases.md
  peer-to-peer-p2p-crypto-exchange-with-escrow:
    title: Peer-to-peer (P2P) crypto exchange with escrow
    type: concept-lineage
    short_description: >-
      A way to buy crypto directly from another person rather than a company:
