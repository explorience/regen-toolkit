        Traditional matching-gift programs (dollar-for-dollar, no breadth
        weighting)
      - Crowdfunding (raises the base amount but has no matching-pool mechanic)
    important_distinctions:
      - >-
        Quadratic funding (a matching-pool allocation formula, requires a
        sponsor-funded pool) vs. quadratic voting (a governance-decision
        mechanism using a personal credit budget) — related math, different use
        case; see the governance-mechanism-design article's treatment of
        quadratic voting.
    tensions:
      - >-
        Rewards breadth of donors, which can be gamed by Sybil attacks (many
        fake small donors); the article does not discuss Gitcoin's anti-Sybil
        safeguards.
    risks_of_flattening: >-
      Presenting "100 people giving $1 can out-earn one person giving $100" as a
      simple rule risks obscuring that the actual match depends on the specific
      round's formula, pool size, and anti-Sybil adjustments in effect at the
      time (the article itself flags that Gitcoin's rounds mix QF with other
      allocation mechanisms by domain).
