    adjacent_meanings:
      - centralized-exchange
      - non-custodial-wallet
    important_distinctions:
      - >-
        The platform's escrow is the safety mechanism — a seller asking to be
        paid "directly to skip the fee" bypasses escrow entirely and is
        explicitly flagged in the source article as the scam pattern to walk
        away from.
    tensions:
      - >-
        Privacy/no-ID-check appeal vs. reduced recourse if a counterparty
        defrauds outside the escrow flow.
    risks_of_flattening: >-
      Naming specific platforms (LocalCoinSwap, Bisq) risks staleness — the
