entries:
  decentralization:
    title: Decentralization
    type: concept-lineage
    short_description: >-
      Spreading control and decision-making across many people instead of
      concentrating it in one place, so no single person, company, or office can
      shut things down, change the rules alone, or lock everyone else out.
      Framed in the article as a way of organizing power, not primarily a
      technology.
    source_traditions:
      - cooperatives
      - mutual aid networks
      - seed-saving circles / community seed swaps
      - rotating savings groups
      - crypto / DAO governance
    toolkit_usage: >-
      Used as a foundations-layer explainer for community organizers and
      permaculturists new to crypto — reframes "decentralization" away from
      crypto-hype jargon toward practices (seed swaps, shared tooling, group
      decision-making) the audience already runs, then bridges to crypto-native
      tools (Snapshot, quadratic voting) and ReFi DAO's Local Nodes model as
      concrete implementations.
    adjacent_meanings:
      - >-
        technical/architectural decentralization (e.g. node distribution,
        consensus)
      - governance decentralization (who decides, per this article's framing)
      - economic decentralization (distributed ownership of value/tokens)
    important_distinctions:
      - >-
        decentralization-is-a-spectrum-not-a-switch — most real systems are
        hybrids (e.g. an open, tamper-proof ledger paired with founder-driven
        day-to-day decisions); the honest question is "who holds power, over
        what, and could they abuse it?" not a binary yes/no.
      - >-
        transparency-is-not-optional — the article argues real decentralization
        comes with *more* transparency, not less, and treats "no one's in
        charge" framing without visible decisions/money/people as a scam signal.
    tensions:
      - >-
        openness-vs-founder-control — a project can have a fully open, immutable
        public ledger while day-to-day decisions still run through a small
        founding group; the article treats this as normal-but-worth-naming
        rather than a failure state.
    risks_of_flattening: >-
      Treating decentralization as purely a technical/architecture property
      (node count, consensus mechanism) erases the article's core claim that it
      is fundamentally about organizing power and accountability — a community
      garden with a rotating steering group can be meaningfully decentralized
      without touching a blockchain.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/what-is-decentralization.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-0f39787ee74e
    source_lineage: what-is-decentralization.md
  infrastructure-follows-function:
    title: Infrastructure Follows Function
    type: concept-lineage
    short_description: >-
      Before choosing a knowledge-management tool, ask what work this part of
      the commons needs to do (explain a concept, inventory resources, track
      decisions, publish a guide) and pick the substrate that fits that job —
      not the tool with the nicest landing page. Corollary: no single tool needs
      to do everything; a healthy commons is usually a hybrid.
    source_traditions:
      - Regen Knowledge Commons Toolkit, Layer 10 (Infrastructure & Substrate)
    toolkit_usage: >-
      Used as the article's governing principle for its tool-by-job directory,
      and again for its public/internal/private visibility-tier mapping (each
      tier gets its own substrate rather than one tool for everything).
    adjacent_meanings:
      - >-
        the portability test — "would your knowledge survive the tool dying?"
        (plain-text/Git as the durable baseline, everything else as a publishing
        or collaboration layer on top)
    important_distinctions:
      - >-
        A tool can make a workflow easier, but it can also distort the commons
        around its own assumptions — infrastructure should serve the work, not
        the reverse.
    risks_of_flattening: >-
      Picking a tool for its polish or landing page rather than the specific job
      (explaining, inventorying, tracking, publishing) it needs to do — the
      article names this as the most common way commons rot.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/knowledge-tools-directory.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-205d26f8a05e
    source_lineage: knowledge-tools-directory.md
  purpose-people-place-process-practice-5p-gathering-framework:
    title: Purpose-People-Place-Process-Practice (5P gathering framework)
    type: concept-lineage
    short_description: >-
      A five-element design framework for gatherings — a specific purpose, a
      deliberate guest list, a matched space, a designed process arc (opening/
      body/closing), and post-gathering practice (follow-through) — treating
      every gathering as an intentional design challenge rather than a default
      meetup script.
    source_traditions:
      - Priya Parker, "The Art of Gathering" (Riverhead Books, 2018)
      - Adrienne Maree Brown, "Emergent Strategy" (AK Press, 2017)
      - Open Civics Framework
    toolkit_usage: >-
      Applied to four local-node gathering formats (Onboarding, Governance,
      Trust-Building, Learning) as the structural template organizers are
      instructed to work through before hosting.
    adjacent_meanings:
      - World Café
      - Fishbowl
      - Open Space Technology
      - Liberating Structures (33 facilitation methods)
      - Circle Practice (talking-piece format)
    important_distinctions:
      - >-
        "Purpose is not topic" — the article is explicit that "to learn about
        Web3" is a topic, not a purpose; a purpose states what will be different
        afterward.
      - >-
        "Agreements are mutual, rules are imposed" — the article deliberately
        avoids "ground rules" language in the Opening step.
    tensions:
      - >-
        Small-group-first, curated-guest-list design guidance vs. open/
        inclusive-by-default community norms.
    risks_of_flattening: >-
      The article attributes Circle Practice's talking-piece format and the
      small-group-before-large-group decision pattern to "many African and
      Indigenous traditions" and "many East African communities" in passing,
      secondary-source, non-attributed-to-a-specific-community language.
      Treating that as settled ethnography rather than a broad-strokes,
      unverified attribution risks flattening living traditions into a
      facilitation technique. See accompanying public-use-boundary.
    high_risk: true
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/gatherings-pattern.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-3432cf7d500b
    source_lineage: gatherings-pattern.md
  portability-knowledge-commons:
    title: Portability (knowledge commons)
    type: concept-lineage
    short_description: >-
      The property that knowledge can move between tools, people, and
      organizations without rotting on the way — i.e., without depending on one
      vendor's proprietary format to remain readable.
    source_traditions:
      - plain-text/local-first software advocacy
      - version-control (Git) culture
    toolkit_usage: >-
      The article's recommended floor for the Regen Knowledge Commons Toolkit
      itself: canonical content in Markdown tracked in Git, with structural
      metadata (title, tags, audience, source lineage) kept in YAML frontmatter
      rather than an app's hidden database.
    adjacent_meanings:
      - federation
      - vendor-lock-in
    important_distinctions:
      - >-
        portability-vs-federation — portability is about YOUR commons moving
        freely; federation is about connecting to OTHER people's commons without
        merging
    risks_of_flattening: >-
      Treating "plain text" alone as sufficient for portability ignores that
      structure (frontmatter/metadata schema) must also travel with the content,
      or the exported files become an unstructured pile.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/federation-portability.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-4e11e89a5db3
    source_lineage: federation-portability.md
  federation-knowledge-commons:
    title: Federation (knowledge commons)
    type: concept-lineage
    short_description: >-
      Separate groups sharing knowledge with each other without merging into one
      unified database, closed-source software, or surrendering control over
      sensitive information.
    source_traditions:
      - >-
        KOI (Knowledge Organization Infrastructure) — BlockScience, Metagov,
        RMIT
      - Fediverse / ActivityPub (Mastodon)
    toolkit_usage: >-
      Framed as mostly a governance-and-naming problem, not a tooling one: name
      what's public/internal/private, give shared things stable names, and you
      can federate "by hand" (a synced public folder) long before adopting a
      protocol like KOI-net.
    adjacent_meanings:
      - reference-identifier-rid
      - portability
    important_distinctions:
      - >-
        federation-vs-consolidation — federation preserves each group's
        boundaries and control; consolidation forces everyone into one shared
        database
      - >-
        identity-portability-vs-content-portability — ActivityPub/Mastodon
        already federates account identity/followers; it does not yet (as of
        2025) federate the underlying post content
    tensions:
      - >-
        protocol-adoption-cost-vs-informal-federation — KOI-net gives structured
        sensor/processor/coordinator roles but requires real setup; an agreed
        shared folder of public Markdown is nearly free but has no formal
        guarantees
    risks_of_flattening: >-
      Equating "federation" with any protocol adoption misses that the article's
      core claim is federation is achievable informally through named boundaries
      and stable references, without any protocol at all.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/federation-portability.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-4e11e89a5db3
    source_lineage: federation-portability.md
  rid-reference-identifier:
    title: RID (Reference Identifier)
    type: concept-lineage
    short_description: >-
      A stable label that points to a knowledge object (doc, message, record)
      without handing over the object itself — like a library call number.
    source_traditions:
      - KOI-net protocol (BlockScience, with Metagov and RMIT)
    toolkit_usage: >-
      The mechanism cited as enabling federation without consolidation:
      organizations share the RID (the label/pointer) while keeping the
      underlying content and access rules under their own control. Attributed to
      BlockScience's Michael Zargham and Ilan Ben-Meir: "a stable concept of a
      reference as something distinct from (but referring to) an underlying
      referent is thus the mechanism that enables organizations to interoperate
      while retaining (and securing) their respective boundaries."
    adjacent_meanings:
      - federation
      - koi-net
    important_distinctions:
      - >-
        reference-vs-referent — the RID is the pointer/label; the referent (the
        actual document/message/record) is never itself transferred
    risks_of_flattening: >-
      Only quoting the RID concept without KOI-net's supporting node roles
      (sensor/processor/coordinator) can make it sound like a naming scheme
      alone accomplishes federation; the roles are what actually move and
      transform the referenced knowledge across a network.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/federation-portability.md
      transformation: quoted
      authorship: ai-assisted
    work_order: wo-4e11e89a5db3
    source_lineage: federation-portability.md
  crypto-wallet-keys-not-money:
    title: Crypto Wallet (keys, not money)
    type: concept-lineage
    short_description: >-
      A crypto wallet does not store cryptocurrency itself — funds live on the
      blockchain. A wallet holds the cryptographic keys (a public key/address to
      receive with, and a private key that must never be shared) that prove a
      slice of the shared ledger belongs to you.
    source_traditions:
      - public-key cryptography
      - blockchain / distributed ledgers
    toolkit_usage: >-
      Foundations-layer explainer for community organizers and permaculturists
      new to Web3; builds the public/private key distinction, then the
      recovery-phrase concept, then newer passkey-based "smart wallet" recovery,
      then hot-vs-cold wallet trade-offs, then names common scam patterns.
    adjacent_meanings:
      - >-
        traditional bank account (explicitly contrasted: no 'forgot password' or
        fraud department for a crypto wallet)
      - >-
        smart wallet (passkey + guardian-based recovery, positioned as a newer
        alternative to the classic recovery-phrase model)
    important_distinctions:
      - >-
        public-key-vs-private-key — the article's central operational
        distinction: the public key/address is safe to share (like a street
        address), the private key must never be shared (like the only key to
        your front door).
      - >-
        recovery-phrase-vs-smart-wallet-recovery — classic 12–24-word seed
        phrase backup vs. newer passkey + guardian-based recovery (e.g. Argent
        "Ready", Base App) that removes the single-written-artifact failure
        mode.
      - >-
        hot-wallet-vs-cold-wallet — always-online convenience (phone/browser)
        vs. offline hardware-device security; framed as a convenience/security
        trade-off, not a strict better/worse.
    tensions:
      - >-
        convenience-vs-security — the article's own suggested pattern is a small
        amount in a hot wallet for everyday use and larger amounts in cold
        storage, rather than resolving the trade-off one way.
    risks_of_flattening: >-
      Treating "wallet" as synonymous with "exchange account" erases the
      article's core point that a wallet holds keys to a decentralized public
      ledger, not custodied funds — the whole recovery-phrase/scam-risk section
      only makes sense once that distinction is clear.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/what-is-wallet.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-553392f77839
    source_lineage: what-is-wallet.md
  regenerative-finance-refi:
    title: Regenerative Finance (ReFi)
    type: concept-lineage
    short_description: >-
      Money flows that "build soil instead of mining it" — the article's core
      framing: rather than being extractive (treating a forest as worth more cut
      down than alive) or merely sustainable (doing less harm), ReFi aims to
      leave the system measurably healthier than it found it, using blockchain
      as a shared, tamper-resistant public record.
    source_traditions:
      - regenerative agriculture
      - blockchain / public ledgers
      - quadratic funding / mechanism design
      - carbon-market tokenization
    toolkit_usage: >-
      Introductory foundations-layer concept for community organizers and
      growers new to crypto; explicitly distinguishes "sustainability maintains,
      regeneration improves" and walks through three concrete problem/solution
      pairs (proving impact via Silvi, community-driven funding via Gitcoin
      quadratic funding, local value circulation via community tokens) before
      addressing energy-use and greenwashing objections.
    adjacent_meanings:
      - >-
        sustainability (doing less harm — explicitly distinguished as a lesser
        goal than regeneration)
      - >-
        DeFi (decentralized finance generally, of which ReFi is framed as a
        values-driven subset)
    important_distinctions:
      - >-
        sustainability-maintains-vs-regeneration-improves — the article's
        central conceptual hinge distinguishing ReFi from ordinary
        sustainability framing.
      - >-
        tokenizing-is-not-automatically-good — a carbon token (or any tokenized
        "nature asset") is only as honest as the underlying project;
        tokenization is a wrapper, not a verification of quality.
    tensions:
      - >-
        pricing-nature-vs-commodifying-nature — putting a number on carbon,
        water, or biodiversity is presented as ReFi's headline move, but the
        article itself flags this is "exactly where greenwashing hides."
    risks_of_flattening: >-
      Reducing ReFi to "carbon tokens" or "crypto for climate" erases the
      article's broader claim that it is fundamentally about redirecting money
      toward people doing regenerative work (soil, community, local
      circulation), not only about pricing ecological assets.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/what-is-refi.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-55907730d33f
    source_lineage: what-is-refi.md
  quadratic-funding-formula-and-the-breadth-over-wealth-design-goal:
    title: Quadratic funding formula and the breadth-over-wealth design goal
    type: concept-lineage
    short_description: >-
      For each project, take the square root of every individual donation, sum
      those roots, then square the total — that squared number is the project's
      share of a shared matching pool. The design goal: the number of distinct
      backers matters more than the size of any single donation.
    source_traditions:
      - >-
        "Liberal Radicalism: A Flexible Design for Philanthropic Matching
        Funds," a 2018 paper by Vitalik Buterin, Zoë Hitzig, and Glen Weyl
    toolkit_usage: >-
      Walked through with a worked example in the article (100 people giving $1
      each outweighs one person giving $100, 10,000 vs. 100 matching weight) to
      make the "breadth beats whales" design goal concrete for organizers
      deciding whether to run a round.
    adjacent_meanings:
      - >-
        Deep Funding, MACI private voting, Conviction Voting, Retroactive
        Funding, and peer-reviewed Hypercerts — the five other mechanisms GG24
        ran alongside QF in the same cycle, per the article's "plural toolkit"
        framing.
    important_distinctions:
      - >-
        Democratic communities systematically underfund shared goods because no
        single person captures the full benefit — QF is designed to correct for
        that specific market failure, not to replace grants generally.
    tensions:
      - >-
        Rewarding breadth of support vs. vulnerability to sybil attacks (one
        person spinning up many wallets to fake a crowd).
    risks_of_flattening: >-
      Reducing QF to "more donors equals more match" without the sybil-defense
      caveats (proof of personhood, cluster-matching corrections) that make a
      round's match trustworthy in practice.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/gitcoin-grants-qf.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-55b29771dc58
    source_lineage: gitcoin-grants-qf.md
  dao-treasury-diversification:
    title: DAO treasury diversification
    type: concept-lineage
    short_description: >-
      Holding a DAO's treasury across multiple asset types — especially
      stablecoins (USDC, DAI) alongside the native governance token — rather
      than concentrating value in one volatile, illiquid asset, in order to
      maintain operational continuity through market cycles.
    source_traditions:
      - traditional corporate/nonprofit treasury and reserve-fund management
      - >-
        DeFi lending and market-making mechanisms (Aave, Gnosis Auction, OTC
        desks)
    toolkit_usage: >-
      Practical heuristic given: maintain 2-3 years of operating expenses in
      stablecoins as a survival buffer; diversify via organic stablecoin
      revenue, strategic token sales (OTC, batch auctions, bonding curves),
      strategic partnerships (discounted token swaps with lock-ups), or
      borrowing against native tokens.
    adjacent_meanings:
      - >-
        portfolio diversification (traditional finance) — same risk-reduction
        logic applied to a DAO's own governance token
    important_distinctions:
      - >-
        treasury size (paper wealth in governance tokens) vs. treasury liquidity
        (actual spendable/stable value) — the article's central paradox
      - >-
        diversification method choice (revenue vs. sale vs. partnership vs.
        borrowing) carries different risk/governance trade-offs, not
        interchangeable tactics
    tensions:
      - >-
        diversifying by selling native tokens can itself crash the token's price
        (the liquidity problem it's trying to solve)
      - >-
        borrowing against tokens avoids sales but introduces liquidation risk if
        token prices drop
    risks_of_flattening: >-
      Treating "diversify into stablecoins" as a universal prescription without
      weighing a specific DAO's values, risk tolerance, and governance structure
      — the article frames treasury management as inseparable from governance
      (who holds power), not a purely technical finance decision.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/treasury-management.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-6e3dae058f08
    source_lineage: treasury-management.md
  native-token-concentration-risk:
    title: Native token concentration risk
    type: concept-lineage
    short_description: >-
      The risk a DAO carries when most of its treasury value sits in its own
      governance token: thin order books (illiquidity), extreme volatility, and
      operational continuity breaking down precisely when the community most
      needs stability (bear markets).
    source_traditions:
      - crypto-market microstructure (order-book liquidity, slippage)
      - DAO/protocol treasury commentary
    toolkit_usage: >-
      Named as the article's core paradox: DAOs holding "$15 billion" across the
      top 50 treasuries appear wealthy on paper while actual financial
      flexibility is severely limited by this concentration.
    adjacent_meanings:
      - >-
        home-bias / concentration risk (traditional finance analogue —
        over-exposure to a single, correlated asset)
    important_distinctions:
      - >-
        governance power (what the token measures) vs. spendable value (what the
        token can reliably realize in a sale) — the token does both jobs poorly
        when treated as the treasury's main asset
    tensions:
      - >-
        the token that best represents community ownership/governance is often
        the worst asset to actually spend from
    risks_of_flattening: >-
      Reducing this to "sell the token" ignores that forced or large token sales
      are exactly what triggers the illiquidity/slippage problem being described
      — the risk and its naive fix are in tension.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/treasury-management.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-6e3dae058f08
    source_lineage: treasury-management.md
  quadratic-funding-qf:
    title: Quadratic Funding (QF)
    type: concept-lineage
    short_description: >-
      Crowdfunding with a matching pool, where the match grows with the number
      of distinct backers rather than the dollar amount they give — "a vote you
      cast with a small donation."
    source_traditions:
      - >-
        Constrained Liberal Radicalism algorithm — "Liberal Radicalism," a 2018
        paper by Vitalik Buterin, Zoë Hitzig, and E. Glen Weyl
    toolkit_usage: >-
      Presented as the prospective-funding mechanism a local node is most likely
      to use before it has a track record; Gitcoin Grants and Giveth run the
      largest QF rounds. Framed as a turnout exercise for organizers, not a
      grant application — outcomes are mostly decided by contributor-list size
      before a round even opens.
    adjacent_meanings:
      - direct grants (application-based, no matching-pool mechanics)
      - >-
        streaming QF (Gitcoin/Geo Web via Superfluid — real-time flow-rate
        matching)
      - >-
        conviction voting (1Hive — continuous token-weighted staking, no round
        cadence)
    important_distinctions:
      - >-
        QF is prospective (pays before the work), distinct from retroactive
        funding (RetroPGF/Retro Funding) and hypercerts, which pay after impact
        is shown.
    tensions:
      - >-
        Breadth-of-participation design goal vs. Sybil attacks (fake identities)
        and collusion (coordinated real users) — the article's stated "pitfall
        you most need to hear."
    risks_of_flattening: >-
      Treating a QF round as free money rather than what the article insists it
      is: a turnout mechanism that rewards community-building work done long
      before the round opens.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/funding-landscape.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-704b0ef07811
    source_lineage: funding-landscape.md
  retroactive-public-goods-funding-retropgf-retro-funding:
    title: Retroactive Public Goods Funding (RetroPGF / Retro Funding)
    type: concept-lineage
    short_description: >-
      Funding that flips prospective funding's timing: instead of pitching a
      plan, a project ships work first, and a later round looks back and pays
      for what proved useful. The Optimism Collective runs the largest version.
    source_traditions:
      - Optimism Collective (850M OP reserved for public goods, 20% of supply)
    toolkit_usage: >-
      Positioned as suiting nodes that already produce visible, attributable
      work rather than brand-new ones; hypercerts are presented as the
      evidentiary record that lets a retro round know what a node actually did.
    adjacent_meanings:
      - hypercerts (the structured impact record retro rounds are read against)
      - >-
        quadratic funding (the prospective counterpart in the article's "two
        families" framing)
    important_distinctions:
      - >-
        Retrospective (pays after impact is shown) vs. prospective (pays before
        the work happens) — the article's organizing distinction for the whole
        funding landscape.
    tensions:
      - >-
        "No proposal-writing theatre" relief vs. the risk of funding yourself
        out of pocket first and hoping a future round notices you.
    risks_of_flattening: >-
      Assuming retro funding suits any node, when the article is explicit it
      rewards track records and therefore suits established nodes, not brand-new
      ones.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/funding-landscape.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-704b0ef07811
    source_lineage: funding-landscape.md
  phishing-crypto:
    title: Phishing (crypto)
    type: concept-lineage
    short_description: >-
      Impersonating a trusted service to steal login details or private
      keys/seed phrases — via fake emails, typosquatted websites, DMs offering
      "help," or malicious browser extensions.
    source_traditions:
      - >-
        general information-security phishing terminology, applied to crypto
        wallets/exchanges
    toolkit_usage: >-
      Used as the first scam pattern in the article's field guide; the "golden
      rule" defense given is that no legitimate service ever asks for a seed
      phrase or private key.
    adjacent_meanings:
      - typosquatting
    important_distinctions:
      - >-
        phishing-vs-rug-pull — phishing steals credentials/keys from a victim; a
        rug pull is a project's own team absconding with pooled funds
    risks_of_flattening: >-
      Treating all phishing as identical hides real variation in vector (email
      vs. malicious browser extension vs. DM) that requires different specific
      defenses.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/common-scams.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-7d08281b2f7e
    source_lineage: common-scams.md
  rug-pull:
    title: Rug pull
    type: concept-lineage
    short_description: >-
      A project's creators take investors' pooled funds and abandon the project,
      often after building tokenomics that quietly blocks holders from selling.
    source_traditions:
      - crypto/DeFi token-launch culture
    toolkit_usage: >-
      Illustrated in the article with the SQUID token (2021) case: price spiked
      from cents to $2,800+, then developers drained funds and the sell-blocking
      code trapped 40,000+ buyers.
    important_distinctions:
      - >-
        anonymous-team-vs-rug-pull — the article stresses an anonymous team
        isn't automatically a scam; trust should come from open code and
        independent audits, not team visibility alone
    risks_of_flattening: >-
      Not every failed/abandoned crypto project is a deliberate rug pull;
      conflating negligence, failure, and intentional fraud under one label can
      mislabel honest failures as scams.
    maturity: raw
