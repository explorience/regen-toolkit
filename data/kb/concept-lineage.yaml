        a coin (native to its own blockchain) vs a token (built atop someone
        else's blockchain) — named as the article's first clarifying distinction
      - >-
        fungible tokens (1:1 interchangeable, e.g. stablecoins) vs NFTs (unique
        identifier + characteristics, e.g. digital art/collectibles)
