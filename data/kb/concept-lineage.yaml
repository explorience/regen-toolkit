  flat-vs-hierarchical-organizational-structure:
    title: Flat vs Hierarchical Organizational Structure
    type: concept-lineage
    short_description: >-
      A contrast between pyramid-shaped organizations (departments, managers,
      executives, decisions flowing top-down) and flat, peer-coordinated
      structures where contributors take on roles by interest and capability
      rather than job title.
    source_traditions:
      - >-
        20th-century theory of the firm (organizational hierarchy as a response
        to coordination-cost problems)
      - >-
        cooperative and associational governance (East African cooperatives
        cited in the article as a comparison point)
      - DAO/blockchain-native peer coordination
    toolkit_usage: >-
      Used in this article as the structural half of the DAO-vs-traditional-firm
      comparison, paired with the decision-making and capital-formation
      dimensions, and connected to the observation that traditional companies
      are geographically limited while DAOs are not.
    adjacent_meanings:
      - flatness as an absence of formal titles (this article's framing)
      - >-
        flatness as an absence of any power differential (a stronger, contested
        claim the article does not make)
    important_distinctions:
      - >-
        flat-structure-vs-actual-power-distribution — the article itself
        cautions elsewhere (token concentration) that a flat org chart does not
        guarantee flat power; formal hierarchy and informal concentration are
        different things.
      - >-
        even-democratic-traditional-orgs-can-drift — the article notes that
        "even organizations founded on democratic principles can drift toward
        concentrated control over time," applying this critique to cooperatives,
        not only corporations.
    tensions:
      - >-
        flexibility-and-self-direction (flat) vs
        need-for-self-direction-without- management-support — flatness "creates
        flexibility but also requires self-direction," per the article.
    risks_of_flattening: >-
      Assuming "flat" automatically means "equal" erases the article's own later
      caution about token concentration recreating centralized control inside a
      nominally flat structure.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/daos-vs-traditional.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-15f037f070f8
    source_lineage: daos-vs-traditional.md
  review-boundary-consequence-based-content-tiering:
    title: Review boundary (consequence-based content tiering)
    type: concept-lineage
    short_description: >-
      A written rule sorting knowledge-commons content into tiers by how much
      damage a wrong or misleading entry does if unchallenged (ephemeral/
      personal → working/shared → canonical/load-bearing), with the human review
      gate applied only where consequence is high.
    source_traditions:
      - >-
        SuperBenefit Knowledge Garden's raw-notes/working-docs/refined-artifacts
        tiering
      - >-
        Elinor Ostrom's commons-governance design principles (clear boundaries,
        locally-made rules)
      - Git/pull-request code-review practice
    toolkit_usage: >-
      The organizing idea of human-review-boundaries.md — proposed as the
      mechanism that lets a knowledge commons stay both open to contribution and
      trustworthy for load-bearing claims.
    adjacent_meanings:
      - review-and-maturity-k1-state-model
      - source-system-stewardship
    important_distinctions:
      - >-
        Sort by "the claim the content makes," not by length or authorship — a
        two-line recorded decision is load-bearing (canonical); a forty-page
        brainstorm is ephemeral.
      - >-
        A review boundary must be legible (written down, findable by a stranger)
        — an unwritten habit in one steward's head is not a boundary.
    tensions:
      - >-
        Cheap-to-pass reviewer checklists vs. the risk that a shrunk review
        becomes a rubber stamp.
    risks_of_flattening: >-
      Framing this as a settled three-tier model risks obscuring that the right
      number and definition of tiers is genuinely team-specific — the article
      itself says the first boundary drawn "will be wrong" and must be
      revisited.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/human-review-boundaries.md
      transformation: synthesized
