  blockchain-trilemma:
    title: Blockchain Trilemma
    type: concept-lineage
    short_description: >-
      The observation that every blockchain must balance three competing
      priorities — scalability (can it handle growing transaction volumes?),
      security (how protected against attacks?), and decentralization (how
      widely distributed is network control?) — and that optimizing for one
      typically means compromising on another.
    source_traditions:
      - >-
        Widely used framing in Ethereum-ecosystem developer discourse; cited in
        the article via ethereum.org's chain-comparison material.
    toolkit_usage: >-
      Used as the article's core decision lens: Ethereum L1 is positioned as
      prioritizing security/decentralization at the cost of scalability, Solana
      as prioritizing scalability at some cost to decentralization, and Layer 2s
      as a middle path that inherits Ethereum's security while improving
      scalability.
    adjacent_meanings:
      - >-
        EVM compatibility (a technical-portability property distinct from the
        trilemma tradeoffs)
    important_distinctions:
      - >-
        No single "best" chain — the article insists the right choice is
        use-case-dependent, not an objective ranking across the trilemma's three
        axes.
    tensions: []
    risks_of_flattening: >-
      Reducing the trilemma to "pick two" oversimplifies — the article shows
      real chains (Layer 2s, Polkadot/Cosmos) attempting partial mitigations
      (inherited security, interoperability) rather than a strict binary
      tradeoff.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/which-chain-right.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-4ec86c6928f5
    source_lineage: which-chain-right.md
  smart-contract-b954ce89:
    title: Smart Contract
    type: concept-lineage
    short_description: >-
      A program that lives at an address on a blockchain, self-executing its
      coded conditions with no company, government, or individual able to alter
      it once deployed.
    source_traditions:
      - >-
        Term coined by cryptographer Nick Szabo in 1994, decades before the
        technology existed to run one.
      - >-
        First implemented practically with Ethereum's 2015 launch, the first
        blockchain able to run general-purpose smart-contract programs.
    toolkit_usage: >-
      Introduced via the market-stall analogy (two traders, a machine that
      releases payment automatically once delivery conditions are met) to ground
      an abstract concept in a concrete regional trade scenario.
    adjacent_meanings:
      - self-executing agreement
      - on-chain program
    important_distinctions:
      - >-
        Smart contract vs traditional contract: traditional contracts need
        lawyers/courts to enforce terms; a smart contract's code enforces the
        terms automatically.
      - >-
        Smart contract vs oracle: the contract's logic is the closed,
        deterministic part; the oracle is the separate service that feeds it
        real-world data.
    tensions:
      - >-
        Immutability protects against secret rule changes but also means bugs
        are permanent — "code is law" cuts both ways.
    risks_of_flattening: >-
      Framing smart contracts as simply "automatic enforcement" risks eliding
      that most real-world regenerative use cases (verified conservation
      practice, verified shipment) depend entirely on the accuracy of an
      external oracle feed, not the contract logic itself.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/smart-contracts-explained.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-55ad5dfd3ee1
    source_lineage: smart-contracts-explained.md
  blockchain-oracle:
    title: Blockchain Oracle
    type: concept-lineage
    short_description: >-
      A service that feeds external, real-world data (weather, shipment arrival,
      prices) into a blockchain so smart contracts — which are closed systems by
      design — can respond to real-world events.
    source_traditions:
      - >-
        Framed in the article as the answer to smart contracts' fundamental
        limitation: a blockchain cannot natively observe anything outside
        itself.
    toolkit_usage: >-
      Used to explain why smart-contract failures in practice are often oracle
      failures (bad or manipulated data feeds), not contract-logic failures —
      directly relevant to regenerative-monitoring and supply-chain use cases.
    adjacent_meanings:
      - data feed
      - real-world bridge
    important_distinctions:
      - >-
        Oracle (external data provider) vs smart contract (the on-chain logic
        that consumes that data) — two separate trust surfaces.
    tensions:
      - >-
        Oracles reintroduce a trust/centralization point into an otherwise
        "trustless" system, which the article flags as "worth knowing before you
        trust a contract with real value."
    risks_of_flattening: >-
      Discussing smart contracts without naming the oracle dependency risks
      implying blockchain systems are fully autonomous verifiers of physical
      reality, when they in fact inherit the reliability of whatever oracle
      feeds them.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/smart-contracts-explained.md
      transformation: summarized
