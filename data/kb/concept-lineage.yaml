  pig-butchering-romance-scam:
    title: Pig butchering (romance scam)
    type: concept-lineage
    short_description: >-
      A long-con scam that builds a genuine-feeling romantic or personal
      relationship before introducing a crypto "opportunity" — the name refers
      to "fattening up" a victim with affection and small wins before draining
      their funds.
    source_traditions:
