  review-maturity-ladder-four-rung-draft-reviewed-maintained-deprecated:
    title: >-
      Review-maturity ladder (four-rung: Draft / Reviewed / Maintained /
      Deprecated)
    type: concept-lineage
    short_description: >-
      A shippable per-page trust-state label for knowledge commons: Draft
      (written, unchecked, anyone can edit) -> Reviewed (a second person
      confirmed accuracy) -> Maintained (reviewed AND someone owns keeping it
      current, with a review date) -> Deprecated (kept for history, points to
      its replacement). Stored in page frontmatter (`status`, `reviewed_by`,
      `last_reviewed`) so it travels with the content.
    source_traditions:
      - Wikipedia content assessment (Stub -> Start -> C -> B -> GA -> FA)
      - >-
        Architecture Decision Records / MADR (Proposed -> Accepted ->
        Deprecated/Superseded)
      - Kubernetes feature gates (Alpha -> Beta -> Stable)
    toolkit_usage: >-
      Crosswalks onto this toolkit's own K1 review-maturity model
      (schemas/review-maturity.yaml): Draft -> maturity "draft", Reviewed ->
      maturity "reviewed", Deprecated -> maturity "deprecated". "Maintained" has
      no exact K1 rung — it layers ownership + a recency check (last_reviewed
      expiry) on top of "reviewed" rather than being a distinct maturity value,
      which is itself a useful gap to flag for K1's crosswalk table.
    adjacent_meanings:
      - >-
        self-claimed state (Draft/Proposed/Alpha — 'I wrote this') vs. granted
        state (Reviewed/Accepted/Stable — 'someone else checked this')
    important_distinctions:
      - >-
        'Maintained' is not just 'still reviewed' — it requires an owner AND a
        last_reviewed date, i.e. an active maintenance commitment, not a static
        label
      - >-
        review effort should scale with risk (low-stakes: one reader;
        high-stakes — money/legal/ecological/governance: two reviewers + an
        owner) rather than a single fixed bar for every page
    tensions:
      - >-
        frictionless draft tiers (encourage capture) vs. gated granted tiers
        (protect trust) — loosening either side breaks the mechanism
    risks_of_flattening: >-
      Treating "Reviewed" as a permanent badge rather than a maintenance
      commitment — the article's core warning is that reviewed pages silently
      rot once nobody re-checks them; conflating "was reviewed once" with "is
      still trustworthy" undoes the whole point of the ladder.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/review-and-maturity.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-ea54c9ef7bb2
    source_lineage: review-and-maturity.md
  bus-factor:
    title: Bus factor
    type: concept-lineage
    short_description: >-
      The number of people who would have to disappear before a project stalls —
      knowledge concentrated in one head has a bus factor of one, meaning a
      single departure breaks continuity.
    source_traditions:
      - software engineering / knowledge-management risk metrics
    toolkit_usage: >-
      Motivates maturity labelling in the Regen Toolkit: when the one expert
      leaves, unreviewed drafts stay behind looking as authoritative as reviewed
      pages unless the trust-state was made legible in advance.
    adjacent_meanings:
      - >-
        key-person dependency / single point of failure (general risk-management
        framing)
    important_distinctions:
      - >-
        bus factor is about knowledge concentration risk, not about the quality
        of any single piece of writing — a well-written draft can still raise
        the bus factor if it is the only record of a decision
    tensions: []
    risks_of_flattening: >-
      Reducing bus factor to "hire more people" rather than "make trust state
      and provenance legible" — the article's point is that labelling is a cheap
      mitigation that does not require more staff.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/review-and-maturity.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-ea54c9ef7bb2
    source_lineage: review-and-maturity.md
  decentralization-ae8ffd00:
    title: Decentralization
    type: concept-lineage
    short_description: >-
      The distribution of power, control, and decision-making away from a single
      hub, existing on a spectrum (centralized → decentralized → distributed)
      rather than as a binary state.
    source_traditions:
      - network/distributed-systems architecture (computer science)
      - >-
        public-administration governance typology (deconcentration, delegation,
        devolution, privatization)
      - blockchain/crypto governance discourse
    toolkit_usage: >-
      Anchor concept for Layer 1 (Foundations) — used to teach that
      "decentralized" is not a single yes/no property but a position on multiple
      independent axes (architecture and governance; technological and
      sociopolitical), and that the right position is context-dependent rather
      than an ideological default.
    adjacent_meanings:
      - subsidiarity
      - polycentric-governance
      - distributed-systems
    important_distinctions:
      - >-
        architecture-vs-governance — a system can be architecturally
        decentralized (nodes) while remaining politically centralized (who
        decides), or vice versa
      - >-
        technological-vs-sociopolitical-decentralization — infrastructure
        independence is separate from equitable distribution of actual power
        (e.g., token concentration)
      - >-
        deconcentration-vs-delegation-vs-devolution-vs-privatization — four
        governance forms of increasing (then differently-directed, in
        privatization's case) authority transfer
    tensions:
      - >-
        decentralization-as-tool-vs-decentralization-as-ideology — the article
        explicitly warns against treating maximal distribution as inherently
        superior ("a tool, not a religion")
    risks_of_flattening: >-
      Collapsing "decentralized" into a single label hides that a system can
      score very differently on technical vs. sociopolitical decentralization —
      e.g., a blockchain with thousands of nodes but 50% of tokens in one wallet
      is technologically distributed yet sociopolitically centralized.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/decentralization-spectrum.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-ee62e83173d4
    source_lineage: decentralization-spectrum.md
  self-custody-crypto-wallets:
    title: Self-Custody Crypto Wallets
    type: concept-lineage
    short_description: >-
      An app that lets a person store, send, and receive digital assets
      directly, controlled by a public address (shareable, like an account
      number) and a secret seed phrase (12 or 24 words granting full access),
      without a bank as intermediary.
    source_traditions:
      - >-
        Bitcoin/Ethereum-era self-custody wallet design (public/private key
        pairs)
      - >-
        browser-extension and mobile wallet UX patterns (MetaMask, Coinbase
        Wallet, Trust Wallet, Rainbow)
    toolkit_usage: >-
      Used as the entry point for a beginner-facing program: contrasts "bank
      account you don't control" with "wallet you fully control," then routes
      beginners to a specific first wallet based on their goal.
    adjacent_meanings:
      - >-
        custodial wallets (e.g., exchange-held funds) as the implicit contrast
        case, though not directly named in this article
      - >-
        hardware/cold wallets as a more security-hardened but higher-friction
        alternative (referenced only via the "related" article link, not
        explained here)
    important_distinctions:
      - >-
        public address (safe to share) vs secret/seed phrase (never share, full
        access)
      - >-
        self-custody (you hold the keys) vs custodial (a company holds them for
        you)
    tensions:
      - >-
        beginner-friendliness vs the real, unforgiving risk of an irrecoverable
        loss if the seed phrase is lost or leaked
    risks_of_flattening: >-
      The guide's ranked "easiest for beginners" framing risks understating that
      all four wallets carry the same fundamental self-custody risk
      (irreversible loss on seed-phrase compromise) — ease-of-setup is not the
      same axis as security posture, and the article does not clearly
      distinguish the two.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/wallet-comparison-guide.md
      transformation: summarized
      authorship: ai-assisted
    source_lineage: wallet-comparison-guide.md
    work_order: wo-003c0d82b00d
  mempool-transaction-waiting-room:
    title: Mempool (transaction waiting room)
    type: concept-lineage
    short_description: >-
      The pool of unconfirmed transactions a blockchain node holds after a
      transaction is broadcast but before it is included in a block; higher fees
      generally earn priority inclusion in the next block.
    source_traditions:
      - bitcoin/ethereum node-software terminology
    toolkit_usage: >-
      Introduced in how-transactions-work.md as step 3 ("Broadcasting") of the
      seven-step transaction journey, framed as a "waiting room" for
      not-yet-confirmed transactions.
    adjacent_meanings:
      - block
      - gas-fee-priority
    important_distinctions:
      - >-
        Being in the mempool is not the same as being confirmed — a transaction
        can sit in the mempool indefinitely (or be dropped) if fees are too low
        relative to network demand.
    tensions:
      - >-
        "Higher fees = priority seating" framing simplifies real fee-market
        dynamics (fee estimation, replace-by-fee, congestion spikes).
    risks_of_flattening: >-
      The "bus with limited seats" analogy is a helpful beginner mental model
      but does not capture that mempool contents differ across nodes (each
      node's mempool is a local, not globally synchronized, view).
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/how-transactions-work.md
      transformation: synthesized
      authorship: ai-assisted
    work_order: wo-03d7c600800a
    source_lineage: how-transactions-work.md
  three-kinds-of-trust-competence-integrity-benevolence:
    title: 'Three kinds of trust: competence, integrity, benevolence'
    type: concept-lineage
    short_description: >-
      A three-part model for the trust a community finance system needs:
      competence trust ("can you do what you say?"), integrity trust ("will you
      do what you said?", built through consistency), and benevolence trust ("do
      you care about me?", built by listening and helping without keeping
      score).
    source_traditions:
      - >-
        organizational-trust research (the competence/integrity/benevolence
        typology is a standard framing in trust literature, applied here to
        community finance specifically)
      - >-
        Francis Fukuyama's social-trust-and-cooperation thesis (cited elsewhere
        in the same article)
    toolkit_usage: >-
      Used to argue that community finance needs all three at once: competence
      to manage funds, integrity to follow the rules, and benevolence so members
      believe the rules protect them rather than trap them. Each type is paired
      with a concrete building practice (e.g. "I am still learning this" earning
      more competence-trust than overclaiming).
    adjacent_meanings:
      - >-
        'trust' used loosely as a single undifferentiated feeling, without the
        article's three-part decomposition
    important_distinctions:
      - >-
        competence trust is about ability, integrity trust is about kept
        promises, benevolence trust is about care for the other person's
        interests — the article treats these as separable and each independently
        buildable.
    tensions: []
    risks_of_flattening: >-
      Treating "trust" as one thing collapses the article's practical
      distinction between three different failure modes (incompetence,
      unreliability, self-interest) that require different remedies.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/building-trust.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-06b003d4c0b2
    source_lineage: building-trust.md
  gathering-formats-for-community-building:
    title: Gathering Formats for Community Building
    type: concept-lineage
    short_description: >-
      A typology of gathering containers (informal, educational,
      decision-making, celebration) chosen deliberately to match a community's
      developmental stage, on the premise that the format shapes the outcome
      more than the topic does.
    source_traditions:
      - Priya Parker's The Art of Gathering (intentional gathering design)
      - >-
        agile retrospective practice — Norm Kerth's Project Retrospectives
        (2001) and its Prime Directive
      - sociocracy's consent-based decision-making (Sociocracy For All)
      - >-
        The World Café (Juanita Brown) and Open Space Technology (Harrison Owen)
        — participant-driven large-group formats
      - Liberating Structures — a menu of facilitation microstructures
    toolkit_usage: >-
      Applied as a stage-matched menu (pre-formation, early formation, active
      operations, growth, renewal) for regen local-node organizers, with a
      sustainability constraint (weekly/monthly/quarterly rhythm) layered on top
      of the format choice.
    adjacent_meanings:
      - >-
        facilitation microstructures (Liberating Structures) as a lighter-weight
        adjacent toolkit to full gathering formats
      - >-
        consent-based decision-making as both an offline meeting practice and a
        rehearsal for on-chain governance tools (Snapshot, multisig)
    important_distinctions:
      - >-
        consent (no remaining objections — Does anyone object / Can you live
        with this) vs consensus (unanimous enthusiasm)
      - >-
        a retrospective (structured look-back on a project/period) vs a town
        hall (forward-looking proposal decision)
      - >-
        informal relationship-building gatherings (foundation layer) vs formal
        decision-making gatherings (built on top of that foundation)
    tensions:
      - >-
        the guide's own warning against turning a relationship-building meal
        into a decision-making meeting ("while we're all here, let's just
        quickly...")
      - >-
        predictability/rhythm vs the temptation to run an ambitious, high-effort
        calendar
    risks_of_flattening: >-
      Presenting a five-stage node lifecycle (pre-formation to renewal) as a
      clean linear progression risks flattening the reality that real
      communities cycle between stages non-linearly (e.g., renewal needs can
      arise mid-"active operations"); the guide does gesture at this by listing
      renewal as its own recurring stage rather than a one-time end point.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/types-of-gatherings.md
      transformation: summarized
      authorship: ai-assisted
    source_lineage: types-of-gatherings.md
    work_order: wo-0953aae86e06
  smart-contract:
    title: Smart Contract
    type: concept-lineage
    short_description: >-
      A small program that lives on a blockchain network and executes
      automatically when its conditions are met — no salesperson, no
      negotiation, no third party enforcing the rules.
    source_traditions:
      - Ethereum developer documentation (ethereum.org)
    toolkit_usage: >-
      Introduced via a vending-machine metaphor (pick item → see price → insert
      payment → machine verifies → item dispensed) to make the concept concrete
      for a non-technical audience, then applied to two regen scenarios:
      transparent community-garden fundraising (funds released only when members
      vote yes) and automatic crop insurance (payout triggered by external
      weather data via an oracle).
    adjacent_meanings:
      - DAO (a group that uses smart contracts to govern collective decisions)
      - oracle (a service that feeds real-world data to a smart contract)
    important_distinctions:
      - >-
        A smart contract enforces rules already agreed and coded — it does not
        decide the rules or verify real-world facts on its own; the
        crop-insurance example still depends on trusted weather data reaching
        the contract.
    tensions:
      - >-
        "The code does what it was programmed to do" is reassuring but also the
        limit: a bug or a bad initial rule is enforced just as faithfully as a
        good one.
    risks_of_flattening: >-
      Reducing "smart contract" to just "automatic payment" erases the point the
      article is making — that the interesting part is removing a trusted
      middleman for a *class* of coordination problems (fundraising, voting,
      conditional payouts), not any single payment.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/what-is-ethereum.md
      transformation: summarized
      authorship: ai-assisted
    source_lineage: what-is-ethereum.md
    work_order: wo-0e57f85327bf
  digital-measurement-reporting-and-verification-dmrv:
    title: Digital Measurement, Reporting, and Verification (dMRV)
    type: concept-lineage
    short_description: >-
      Using phones/computers to measure what happened (e.g. trees planted),
      report that information, and verify it is true — the "digital" version of
      traditional MRV (Measurement, Reporting, Verification) used in
      environmental/carbon programs.
    source_traditions:
      - >-
        traditional MRV frameworks used in carbon markets and environmental
        programs (implied by the article's "many carbon markets... now require
        verified impact data")
      - participatory/community-based monitoring practice
      - >-
        mobile data-collection tooling (KoboToolbox, ODK) developed for
        humanitarian/development-sector fieldwork
    toolkit_usage: >-
      Introduced in this article as an accessible, low-barrier practice for
      grassroots regenerative-project practitioners (tree planting, water
      conservation, grazing-land recovery), explicitly framed as something
      achievable with a basic smartphone rather than expensive equipment.
    adjacent_meanings:
      - >-
        dMRV as a formal carbon-credit-issuance requirement (heavier-weight,
        standards-body usage, referenced but not detailed in this beginner
        article)
      - >-
        dMRV as informal community impact-storytelling (this article's actual
        framing — "you become the storytellers of your own impact")
    important_distinctions:
      - >-
        measurement-vs-reporting-vs-verification — the article is careful to
        define these as three distinct steps, not synonyms: counting/recording,
        sharing the information, and proving it is true respectively.
      - >-
        automated-vs-human-verification — the article names both satellite
        imagery (automated) and human verifiers as valid verification paths,
        often used together (e.g. the grazing-land example uses both community
        observation and satellite confirmation).
    tensions:
      - >-
        simple-community-level-practice vs formal-carbon-market-requirements —
        the article bridges a low-barrier practice to a high-stakes use case
        (carbon market access) without fully addressing the gap between informal
        photo-logging and the rigor formal carbon registries require.
    risks_of_flattening: >-
      Treating "took some photos with a phone" as equivalent to formal,
      registry-grade dMRV flattens a real rigor gap; the article's own framing
      (start simple, build the habit, connect with practitioner networks) reads
      as a beginner on-ramp toward more rigorous dMRV, not a claim that phone
      photos alone satisfy carbon-market verification standards.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/dmrv.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-0e8b32eb0398
    source_lineage: dmrv.md
  institutional-memory-for-community-nodes:
    title: Institutional Memory (for community nodes)
    type: concept-lineage
    short_description: >-
      Durable, documented knowledge (decisions, processes, history) that
      survives personnel changes, so a community "becomes more than the sum of
      its current members" and doesn't lose knowledge every time someone leaves.
    source_traditions:
      - >-
        organizational-memory theory (broader management/knowledge-management
        field)
      - >-
        the Greenpill Local Regen Guide (named directly in the article as
        emphasizing that communities need to "remember what they have learned")
      - open-source project documentation culture (GitHub/GitBook practices)
    toolkit_usage: >-
      Used as this article's central justification for documentation practice —
      framed specifically for Local Node communities (per ReFi DAO's Local Nodes
      model) rather than generic corporate knowledge management, with East
      Africa-specific tool-accessibility framing (basic smartphones, data/WiFi
      access).
    adjacent_meanings:
      - >-
        institutional memory as formal records-management practice (broader,
        more bureaucratic usage)
      - >-
        institutional memory as informal oral tradition passed between members
        (the implicit "before" state this article is trying to move nodes away
        from)
    important_distinctions:
      - >-
        documentation-vs-institutional-memory — documentation is the mechanism;
        institutional memory is the outcome. The article is explicit that
        undocumented knowledge "walks out the door when people leave," making
        documentation the necessary but not sufficient condition (it must also
        be maintained, per the article's "Maintaining Documentation Over Time"
        section).
    tensions:
      - >-
        documentation-effort-now vs benefit-realized-later — institutional
        memory's value is often invisible until a key person leaves or a dispute
        needs resolving, making it easy to deprioritize versus urgent day-to-day
        work.
    risks_of_flattening: >-
      Treating "we have a wiki" as equivalent to having institutional memory
      flattens the article's explicit warning that outdated, unowned
      documentation "can actually cause harm" — the memory has to stay current
      and owned, not merely exist.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/documentation-knowledge.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-12f41d6ac647
    source_lineage: documentation-knowledge.md
  one-job-per-event-educational-social-working-celebration:
    title: One job per event (educational / social / working / celebration)
    type: concept-lineage
    short_description: >-
      A design constraint for community events: give each gathering exactly one
      of four jobs — educational (teach one thing), social (build relationships,
      no agenda), working (make concrete progress together), or celebration
      (mark a win, thank contributors) — rather than trying to do all of them in
      one evening.
    toolkit_usage: >-
      Structures the article's five-phase event-planning process; "define the
      job" is phase one, and the article argues social and working events are
      the most underrated for a young node (education attracts strangers,
      relationships and shared output make them stay).
    adjacent_meanings:
      - >-
        Priya Parker–style intentional gathering design (purpose-first event
        framing, referenced by name in a sibling article on gathering patterns
        rather than this one)
    important_distinctions:
      - >-
        "The single biggest mistake is asking one event to do everything" — the
        article explicitly contrasts this against combining teaching,
        relationship-deepening, decision-making, and celebration in one event.
    tensions: []
    risks_of_flattening: >-
      None flagged — a general event-facilitation heuristic, not attributed to a
      specific tradition or community.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/planning-web3-events.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-13f3c98bb4d6
    source_lineage: planning-web3-events.md
  local-node-regen-network-chapter:
    title: Local Node (regen network chapter)
    type: concept-lineage
    short_description: >-
      A small, place-based chapter of a wider regenerative network that runs its
      own projects and coordination — the article's central unit of analysis for
      where founding pitfalls occur.
    toolkit_usage: >-
      Used throughout common-pitfalls.md as the thing being founded/stewarded;
      contrasted against "the wider network" (e.g. Greenpill Network, Regen
      Coordination Hub) it connects to without being absorbed by.
    adjacent_meanings:
      - chapter (Greenpill's term for the same unit)
      - DAO (a local node may or may not formalize as one)
    important_distinctions:
      - >-
        a local node is autonomous-yet-connected, distinct from both full
        isolation and full absorption into a parent network
    tensions:
      - autonomy vs shared-learning
      - technology-first vs relationships-first founding
    risks_of_flattening: >-
      Treating "local node" as synonymous with "DAO" erases that most founding
      failures in the article are social/organizational, not technical.
