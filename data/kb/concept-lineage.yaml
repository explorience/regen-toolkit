      - >-
        Crypto-native "streaming" contributions (e.g. Superfluid-based recurring
        donations described elsewhere on the site) — same cadence idea,
        different mechanism
    important_distinctions:
      - >-
        A ROSCA rotates the full pooled amount to one member at a time; a node's
