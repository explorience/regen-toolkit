  double-spend-problem-and-the-pre-bitcoin-proof-of-work-lineage:
    title: Double-spend problem and the pre-Bitcoin proof-of-work lineage
    type: concept-lineage
    short_description: >-
      The problem of preventing someone from spending the same unit of digital
      money twice without a trusted central bank to check balances — the central
      puzzle Bitcoin's 2008 whitepaper solved by having every participant keep a
      shared, proof-of-work-verified record of all transactions.
    source_traditions:
      - >-
        David Chaum's ecash (1983) — privacy-preserving digital money, still
        needed a central authority
      - >-
        Adam Back's hashcash (1997) — introduced proof-of-work (computers prove
        they expended energy)
      - >-
        Wei Dai's b-money (1998) — distributed ledger where everyone tracks
        everyone else's money, couldn't work without a central server
      - >-
        Nick Szabo's bit gold (1998) — digital tokens with real scarcity via
        proof-of-work, never launched
      - >-
        Hal Finney's RPOW (2004) — proved proof-of-work tokens could transfer
        between people
    toolkit_usage: >-
      Used in the article as the throughline connecting five prior attempts at
      digital cash to Satoshi Nakamoto's 2008 whitepaper, which the article
      frames as solving the double-spend problem "without a bank" by having
      "everyone... keep a shared record of all transactions, verified through
      proof-of-work."
    adjacent_meanings:
      - >-
        byzantine fault tolerance (the general distributed-systems problem of
        reaching agreement despite unreliable/adversarial participants)
    important_distinctions:
      - >-
        each pioneer solved a piece (privacy, proof-of-work, distributed
        tracking, scarcity, transferability) but none combined all of them into
        a working, launched system before Bitcoin
    tensions: []
    risks_of_flattening: >-
      Crediting Bitcoin's whitepaper as a single point of invention erases the
      30-year lineage of prior attempts the article itself documents — the
      innovation was combination and shipping, not any one novel primitive.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/bitcoin-history.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-648651c05dac
    source_lineage: bitcoin-history.md
  liquid-delegation:
    title: Liquid Delegation
    type: concept-lineage
    short_description: >-
      A delegation model where members can delegate, re-delegate, or revoke
      their voting power at any time, and delegation can be transitive — Alice
      delegates to Bob, who delegates to Carol, so Alice's vote flows through
      Bob to Carol.
    source_traditions:
      - >-
        liquid democracy theory (named directly in the article's own sources
        list)
      - representative-vs-direct-democracy debates
      - DAO governance-tooling implementations of transitive delegation
    toolkit_usage: >-
      Presented in this article as the most flexible of four delegation types
      (full, topic-based, liquid, time-limited), traded off against full
      delegation's simplicity and topic-based delegation's expertise-matching.
    adjacent_meanings:
      - >-
        liquid democracy as a national/political voting-reform proposal (broader
        usage, not DAO-specific)
      - >-
        liquid delegation as implemented in specific on-chain governance tooling
        (this article's DAO-specific framing)
    important_distinctions:
      - >-
        liquid-vs-full-delegation — full delegation is a single, static grant of
        all voting power to one delegate; liquid delegation allows continuous
        re-delegation and transitive chains.
      - >-
        liquid-vs-topic-based-delegation — topic-based splits delegation by
        subject area (finance, technical, community); liquid is about
        revocability and transitivity, and the two dimensions can combine.
    tensions:
      - >-
        flexibility-and-responsiveness vs complex-power-chains — the article
        names "can create complex power chains, requires sophisticated tooling"
        as liquid delegation's direct con.
    risks_of_flattening: >-
      Treating liquid delegation as strictly "more democratic" than full
      delegation flattens the article's own caution that transitive chains can
      obscure where power actually concentrates, making accountability harder to
      track even as flexibility increases.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/delegation-representation.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-6675a98b235f
    source_lineage: delegation-representation.md
  quadratic-voting:
    title: Quadratic Voting
    type: concept-lineage
    short_description: >-
      A voting mechanism where a member can cast multiple votes on an issue, but
      each additional vote costs exponentially more (tokens burned), creating
      diminishing returns that counter simple wealth-weighted dominance.
    source_traditions:
      - mechanism design / public-choice economics
      - >-
        Glen Weyl and Eric Posner's "Radical Markets" work (per the article's
        cited "Essays in Power" reference)
      - DAO governance experimentation (e.g. CityDAO)
    toolkit_usage: >-
      Presented in this article as the second of five DAO governance models —
      positioned as the direct response to token-weighted voting's
      whale-dominance problem, at the cost of added conceptual and
      implementation complexity.
    adjacent_meanings:
      - quadratic voting as a governance mechanism (this article's usage)
      - >-
        quadratic funding as a related-but-distinct matching-funds mechanism
        (not covered in this article)
    important_distinctions:
      - >-
        quadratic-voting-vs-token-weighted-voting — quadratic voting still
        requires holding tokens to vote, it changes the cost curve of casting
        additional votes rather than removing the token requirement entirely.
    tensions:
      - >-
        fairer-representation vs harder-to-understand — the article names
        "requires user familiarity with the underlying mathematics" as a direct
        con.
    risks_of_flattening: >-
      Describing quadratic voting only as "fairer" flattens that it is still a
      token-gated mechanism — it changes who wins among token holders, not
      whether non-token-holders get a voice.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/dao-governance-models.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-687e48ae4084
    source_lineage: dao-governance-models.md
  dao-voting-mechanisms:
    title: DAO Voting Mechanisms
    type: concept-lineage
    short_description: >-
      The family of mechanisms DAOs use to turn proposals into decisions —
      ranging from simple token-weighted quorum voting to quadratic voting,
      time-weighted conviction voting, prediction-market-based holographic
      consensus, small-group multi-sig approval, and gasless off-chain signature
      voting.
    source_traditions:
      - >-
        traditional deliberative-assembly quorum rules (the article's own
        "general assembly" analogy)
      - Gitcoin's quadratic funding mechanism design
      - Giveth's conviction voting implementation
      - prediction-market mechanism design (holographic consensus)
    toolkit_usage: >-
      Used as a comparison menu for DAO operators, explicitly concluding that
      most mature DAOs layer multiple mechanisms rather than picking one.
    adjacent_meanings:
      - >-
        quorum voting as practiced in non-blockchain cooperative boards and
        community associations (the article notes Somaliland/East-Africa
        cooperative boards face the same low-active-participation dynamic,
        without naming a specific case or source)
    important_distinctions:
      - >-
        on-chain quorum/token voting (simple, plutocratic) vs quadratic voting
        (cost rises with the square of votes cast, dampening wealth dominance)
      - >-
        conviction voting (time-weighted, cannot be swung last-minute) vs
        holographic consensus (prediction-market-based proposal triage)
      - >-
        full-community voting vs multi-sig (small trusted group, fast but
        centralized)
    tensions:
      - >-
        decentralization ideal vs the practical need for fast multi-sig
        decisions on routine/emergency matters
      - >-
        manipulation-resistance (conviction voting, quadratic voting) vs added
        complexity and slower decisions
    risks_of_flattening: >-
      Presenting these six mechanisms as a tidy toolkit risks understating that
      each embeds different values about whose voice counts more (wealth,
      time-commitment, prediction-market savvy, or trusted-group membership) —
      the article does gesture at this ("depends on your community's values")
      but doesn't work through any single mechanism's failure modes in depth.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/voting-mechanisms.md
      transformation: summarized
      authorship: ai-assisted
    source_lineage: voting-mechanisms.md
