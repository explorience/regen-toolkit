      - ReFi DAO and Greenpill Network's hybrid, tool-optional network model
    toolkit_usage: >-
      Used to reframe "should we become a DAO?" as "which of three concrete
      problems (treasury custody, verifiable decisions, roles surviving
      turnover) do we actually have?" — formalize only the piece that answers a
      live problem, not the whole stack pre-emptively.
    adjacent_meanings:
      - >-
        legal wrapper (a DAO-specific wrapper like a Wyoming DUNA is one path to
        legal personality for an on-chain-governed node, not the same as
