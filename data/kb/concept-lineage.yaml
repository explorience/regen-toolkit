  taxonomy-knowledge-organization:
    title: Taxonomy (knowledge organization)
    type: concept-lineage
    short_description: >-
      A hierarchy of categories used to file and find things — each item sits
      under a broader category. The formal (SKOS) version gives each concept one
      preferred label and any number of alternate labels (synonyms), with
      broader/narrower/related relations.
    source_traditions:
      - library and information science
      - controlled-vocabulary / thesaurus practice
      - SKOS (W3C linked-data standard)
    toolkit_usage: >-
      Recommended default for knowledge commons: build the taxonomy in SKOS
      first (prefLabel/altLabel/broader/narrower), reach for an ontology only
      when a specific recurring task needs machine reasoning.
    adjacent_meanings:
      - >-
        folksonomy (uncontrolled, user-generated tagging — taxonomy is
        controlled)
      - category tree / folder hierarchy (informal analogue)
    important_distinctions:
      - >-
        taxonomy classifies and enables navigation; it does not encode reasoning
        rules (that's ontology's job)
      - >-
        a taxonomy concept has ONE preferred label + alternates — this is what
        stops label drift (e.g. 'grants'/'funding'/'money')
    tensions:
      - >-
        simplicity/accessibility (non-technical teammates can read and extend
        it) vs. expressive limits (no inference)
    risks_of_flattening: >-
      Treating every useful adjective or tag as if it were a taxonomy type
      causes the same "ontology sprawl" problem taxonomies are meant to avoid —
      the type/tag distinction has to be actively maintained, not assumed.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/ontology-vs-taxonomy.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-7fb26c01e3dc
    source_lineage: ontology-vs-taxonomy.md
  ontology-knowledge-organization:
    title: Ontology (knowledge organization)
    type: concept-lineage
    short_description: >-
      Describes the kinds of things (classes) in a domain and the specific,
      named, typed relationships between them and their instances (individuals),
      in a form a computer can reason over — enabling inference (e.g. flagging a
      Grant missing a required Report) that a taxonomy cannot do.
    source_traditions:
      - knowledge engineering / semantic web (RDF, RDFS, OWL)
      - artificial intelligence (knowledge representation)
    toolkit_usage: >-
      The Regen Toolkit's own ontology layer aims for "enough shared meaning
      that people, tools, and future AI workflows can work together without
      silently inventing incompatible categories" — not a perfect ontology
      before use. Positioned as the second step after a taxonomy, adopted only
      when a genuine need for machine-readable relationships and inference
      exists.
    adjacent_meanings:
      - >-
        knowledge graph (a populated instance of an ontology's classes +
        relationships)
      - >-
        controlled vocabulary (taxonomy's simpler cousin, often confused with
        ontology)
    important_distinctions:
      - class vs. individual — Grant (type) vs. this March seed grant (instance)
      - >-
        a type defines what something IS; a tag describes how something may be
        classified/filtered — confusing them creates ontology sprawl
    tensions:
      - >-
        expressive power (inference, structured queries) vs. maintenance cost
        (full-time modeling work if scope isn't disciplined)
    risks_of_flattening: >-
      Building a full ontology before a task actually needs machine reasoning —
      most knowledge commons never need this step, and premature ontology work
      is the "opposite of outliving turnover" the article warns against.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/ontology-vs-taxonomy.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-7fb26c01e3dc
    source_lineage: ontology-vs-taxonomy.md
  minimum-viable-node-mvn:
    title: Minimum Viable Node (MVN)
    type: concept-lineage
    short_description: >-
      The smallest real version of a local initiative that actually does
      something for real people — the smallest loop of people coordinating value
      together that can be run with the people already on hand, before tokens,
      treasuries, or on-chain governance enter the picture.
    source_traditions:
      - lean-startup minimum viable product (MVP)
    toolkit_usage: >-
      Framed as the answer to three specific organizer fears — burnout, building
      something nobody wants, and central overreach — and operationalized in the
      article as three load-bearing parts: a one-sentence shared purpose, a way
      to track value, and five to ten people who reliably show up.
    adjacent_meanings:
      - minimum viable product (MVP), the lean-startup source concept
    important_distinctions:
      - >-
        "One is a plan. The other is a working node with a sample size of two."
        — the article's own distinction between writing a whitepaper for a
        community currency and actually lending a neighbour a drill in exchange
        for tracked time.
      - >-
        Autonomous yet connected — an MVN is explicitly not isolationist; the
        article distinguishes "belonging to a network" from "being captured by
        one."
    tensions:
      - >-
        Guarding against central overreach (keeping heavy machinery out) vs.
        tapping shared learning from networks like ReFi DAO and Greenpill so the
        node doesn't reinvent every wheel.
    risks_of_flattening: >-
      Treating "minimum viable" as an excuse to skip the hard part (real
      conversations, an actual exchange with real people) rather than as a
      sequencing discipline that defers technology until human coordination is
      actually straining.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/minimum-viable-node.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-810346fad236
    source_lineage: minimum-viable-node.md
  source-system:
    title: Source system
    type: concept-lineage
    short_description: >-
      A living knowledge environment (wiki, repo, research database, forum,
      digital garden) — not a single document or a static link — that has a
      steward, receives ongoing additions, and offers a return path to credit
      and trace material back to its origin.
    source_traditions:
      - digital-garden practice (Maggie Appleton)
      - commons governance (Elinor Ostrom's design principles)
      - open-source repo/maintainer conventions
    toolkit_usage: >-
      The Regen Knowledge Commons Toolkit's Resource Graph layer is explicitly
      framed as "not a link list" but the place the rest of the toolkit stays
      grounded in reality; the three-question test (Who tends this? Is new
      material still added? Can I trace and credit it?) determines whether a
      dependency is a source system or a rotting link.
    adjacent_meanings:
      - >-
        link list / resources page (a flat, unowned, unmaintained set of URLs —
        explicitly NOT a source system)
      - >-
        Resource Graph vs. Ecosystem Atlas (storage-with-lineage vs. the
        interpretive lens layered on top of it)
    important_distinctions:
      - >-
        a source system has three required properties: steward, ongoing
        additions, return path to credit — a source lacking any one of these is
        a link, not a system
      - >-
        inclusion does not mean endorsement — adding a source system as a
        reference is not the project vouching for its content
    tensions:
      - >-
        openness to add broadly vs. the discipline of marking maturity honestly
        so raw inclusions don't silently become 'true'
    risks_of_flattening: >-
      Treating any URL you cite as a "source system" without a steward or return
      path — this collapses the distinction the whole concept exists to
      preserve, and lets link rot back in under a new name.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/source-systems.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-8f88aa8a3771
    source_lineage: source-systems.md
  provenance-vs-lineage:
    title: Provenance (vs. lineage)
    type: concept-lineage
    short_description: >-
      The recorded origin and history of a piece of knowledge — where it came
      from, who made it, and how it changed — distinguished from "lineage,"
      which is the path data took through systems. Provenance answers "why do we
      believe this, and who said it first?"
    source_traditions:
      - data-engineering (data lineage vs. provenance distinction)
      - archival/records science (chain of custody)
    toolkit_usage: >-
      Directly maps to this framework's own `provenance` mixin
      (schemas/provenance.yaml: origin, surfaced_by, adapted_from,
      transformation, authorship) — the mechanism that keeps "inclusion does not
      mean endorsement" honest by making origin traceable on every object.
    adjacent_meanings:
      - >-
        data lineage (the technical path through systems — a related but
        distinct concept per the Snowflake source cited)
    important_distinctions:
      - >-
        lineage = the path data took through systems; provenance = the
        historical record of origin, custody, and trust
    tensions:
      - >-
        provenance is the highest-leverage habit for a long-lived commons, but
        it is also the part contributors most often skip because it feels like
        overhead in the moment
    risks_of_flattening: >-
      Losing provenance lets claims decay into folklore — repeated by everyone,
      backed by no one — which is exactly the failure mode a knowledge commons
      is trying to avoid by recording origin every time.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/source-systems.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-8f88aa8a3771
    source_lineage: source-systems.md
  outputs-vs-outcomes-vs-impact:
    title: Outputs vs. Outcomes vs. Impact
    type: concept-lineage
    short_description: >-
      The core distinction the impact-measurement field rests on: outputs are
      countable activity ("we ran 12 workshops"), outcomes are what actually
      changed for people or ecosystems as a result ("30 farmers adopted a
      regenerative practice"), and impact is the difference the work made versus
      what would have happened anyway (if the trees would have been planted
      regardless, impact is zero even with 400 outputs).
    source_traditions:
      - impact evaluation / M&E (monitoring & evaluation)
      - theory of change methodology
      - MRV (measurement, reporting, verification) for ecological projects
    toolkit_usage: >-
      Central diagnostic frame for local-node builders in the article: most
      nodes count outputs because they're "easy and seductive," but funders and
      the node's own future self care about outcomes and impact; the article
      uses it to argue for lightweight before/after surveys and follow-ups
      rather than a research budget.
    adjacent_meanings:
      - >-
        vanity metrics (activity counted for its own sake, named as the failure
        mode this distinction guards against)
      - >-
        theory of change (the one-page map from activities to desired change,
        used to decide which two or three numbers are worth collecting)
    important_distinctions:
      - >-
        counting-activity-vs-demonstrating-change — "we ran 12 workshops"
        (output) tells no one anything on its own; "12 workshops, after which 30
        farmers switched to cover-cropping, up from 4 the year before" (outcome)
        is a story with a spine.
      - >-
        outcome-vs-counterfactual-impact — an outcome can occur without the
        node's work being the cause of it; impact specifically nets out what
        would have happened anyway.
    tensions:
      - >-
        rigor-vs-burnout — the article explicitly warns against "becoming a
        spreadsheet bureaucracy"; the recommended discipline is a small number
        of weekly-checked metrics, not comprehensive measurement.
    risks_of_flattening: >-
      Treating any counted number as equally meaningful "measurement" erases the
      distinction the whole article is built on — a high output count can
      coexist with zero real impact, and the article frames that gap as where
      "good local initiatives quietly die."
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/why-measurement-matters.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-a796f519a8b8
    source_lineage: why-measurement-matters.md
  stablecoins:
    title: Stablecoins
    type: concept-lineage
    short_description: >-
      Cryptocurrencies pegged to a stable reference asset (typically the US
      dollar) so their value doesn't swing the way bitcoin's does, making them
      practical for organizations needing predictable budgets.
    source_traditions:
      - crypto/DeFi
      - traditional finance (currency-peg concept)
    toolkit_usage: >-
      Positioned in this article as the practical, everyday-operations use case
      for nonprofits (vs. bitcoin/volatile-crypto donations for one-off crisis
      fundraising) — cross-border payments and predictable budgeting.
    adjacent_meanings:
      - crypto-donations
      - cross-border-payments
    important_distinctions:
      - >-
        stablecoins-vs-volatile-crypto — stablecoins are framed as suited to
        recurring operational use, not speculative holding
    risks_of_flattening: >-
      The article doesn't distinguish stablecoin types (fiat-collateralized vs.
      algorithmic vs. crypto-collateralized) or their differing risk profiles —
      treating "stablecoin" as a single practical mechanism.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/case-studies-nonprofits.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-b3d9480838b4
    source_lineage: case-studies-nonprofits.md
  blockchain:
    title: Blockchain
    type: concept-lineage
    short_description: >-
      A digital record (ledger) that many computers (nodes) keep identical,
      synchronized copies of, organized into blocks that each carry a hash
      (fingerprint) of the previous block, making the history tamper-evident and
      removing the need for a single trusted keeper.
    source_traditions:
      - distributed systems / distributed ledger technology
      - cryptography (cryptographic hashing, consensus mechanisms)
      - digital currency (Bitcoin's original use case)
    toolkit_usage: >-
      Introduced via a "village notebook" analogy for readers new to crypto;
      grounds the toolkit's later, more technical articles (proof of work/stake,
      wallets, decentralization) in a plain-language first encounter.
    adjacent_meanings:
      - >-
        distributed ledger (the general category; a blockchain is one specific
        structure — hash-chained blocks — within it)
      - >-
        database with replication (superficially similar copy-everywhere idea,
        but lacks the hash-chaining + consensus that make a blockchain
        tamper-evident without a trusted operator)
    important_distinctions:
      - >-
        immutable ≠ unchangeable-in-theory — rewriting settled history is
        possible in principle but requires redoing every subsequent block and
        persuading a majority of nodes simultaneously, which is what makes it
        impractical rather than impossible
      - >-
        trustless ≠ untrustworthy — it means no single keeper needs to be
        trusted because every node can verify every other node's records
    tensions:
      - >-
        permanence protects against tampering but also means mistakes (wrong
        entries, misdirected payments) usually can't be undone
      - >-
        public chains are often fully visible, so transparency and privacy pull
        against each other for sensitive community information
    risks_of_flattening: >-
      Treating "blockchain" as a single monolithic technology with one energy
      profile or one privacy model — proof-of-work vs. proof-of-stake chains
      differ by roughly three orders of magnitude in energy use, and public vs.
      permissioned chains differ sharply in visibility.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/what-is-blockchain.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-c60d165437c8
    source_lineage: what-is-blockchain.md
  proof-of-work-vs-proof-of-stake:
    title: Proof of work vs. proof of stake
    type: concept-lineage
    short_description: >-
      Two blockchain consensus mechanisms for agreeing what's true across nodes
      without a central authority. Proof of work secures the chain by burning
      computing power/electricity (Bitcoin); proof of stake secures it through
      deposited funds rather than raw computation (Ethereum since its 2022
      "Merge," and Celo).
    source_traditions:
      - cryptography / distributed-consensus research
    toolkit_usage: >-
      Used in the article's "honest costs" section to correct a dated
      assumption: "blockchain wastes energy" is true of proof-of-work chains
      like Bitcoin but false of proof-of-stake chains, which is what most
      regenerative-economy projects (built on Ethereum, Celo) actually run on.
    adjacent_meanings:
      - >-
        mining (the proof-of-work process of competing to add the next block)
        vs. staking (the proof-of-stake process of depositing funds to earn the
        right to validate)
    important_distinctions:
      - >-
        energy use differs by roughly three orders of magnitude between the two
        mechanisms per the article's cited figures — they are not
        interchangeable when evaluating a project's environmental footprint
      - >-
        Ethereum's 2022 switch ("the Merge") changed only the consensus
        mechanism, not what the chain is used for — same network, different
        security method
    tensions:
      - >-
        proof-of-work's energy cost buys a very long, battle-tested security
        track record (Bitcoin); proof-of-stake trades some of that track record
        for far lower energy use
    risks_of_flattening: >-
      Citing Bitcoin's energy use as if it applied to "blockchain" generally —
      the article explicitly warns this generalization is now false for Ethereum
      and Celo, the chains most regenerative projects actually use.
    maturity: raw
    ai_assisted: true
    provenance:
      origin: src/content/docs/what-is-blockchain.md
      transformation: summarized
      authorship: ai-assisted
    work_order: wo-c60d165437c8
    source_lineage: what-is-blockchain.md
  local-node-refi:
    title: Local node (ReFi)
    type: concept-lineage
    short_description: >-
