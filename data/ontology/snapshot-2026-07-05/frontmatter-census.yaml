# Notes on how the vocab counts were derived (so the numbers reconcile).
value_vocabulary_notes:
  audience: >-
    67 articles carry `audience` but only 65 hold a value: `how-transactions-work.md`
    and `treasury-management.md` have an empty array `[]`. The field shape is
    inconsistent — scalar string in ~41 articles, a list in 26 (all single-element
    except the 2 empties). Counts above tally value occurrences (65), not the field
    (67).
  category: >-
    60 articles carry `category`; the remaining 59 have no category. No `playbooks`
    value is ever used even though 3 articles set `track` to 3.
  domain_and_function: >-
    `domain` and `function` never appear as top-level frontmatter keys; they exist
    only nested under `tags` (41 articles). Reported here as `tags.domain` /
    `tags.function`.
  absent_ontology_layers: >-
    None of the ontology's `scale`, `context`, `tech_surface`, or `forms_of_capital`
    (the 8-forms-of-capital extension) classification layers appear as frontmatter
    fields on any of the 119 articles (0 occurrences). The richest declared layers —
    including the capital extension — are entirely unpopulated in live content.

# Where the article vocab does NOT match regen-toolkit-classification.yaml's declared vocab.
# Every count below is drawn from value_vocabularies above.
divergence_notes:
  - field: maturity
    articles_with_field: 41
    article_vocab: [Beginner, Intermediate, Advanced]
    classification_yaml_vocab: [seed, experimental, emerging, proven, canonical]
    divergence: >-
      Total mismatch. Articles use a reader-DIFFICULTY scale (Intermediate 23,
      Beginner 12, Advanced 6); classification.yaml declares a content-LIFECYCLE /
      review-maturity scale (seed…canonical). 0 of 41 articles use any declared
      value; all 41 diverge. Different axis entirely, sharing only the field name.

  - field: stage
    articles_with_field: 44
    article_vocab: [build, draft]
    classification_yaml_vocab: [explore, learn, build, deploy, scale, sustain]
    divergence: >-
      Near-degenerate and semantically different. Values used are build (43) and
      draft (1). Only `build` lexically overlaps the declared vocab; `draft` does
      not. Co-occurring with `draft`, the field reads as an editorial
      PRODUCTION-PIPELINE flag (draft → build), not classification.yaml's reader
      ADOPTION-JOURNEY (explore/learn/build/deploy/scale/sustain). explore, learn,
      deploy, scale, sustain are never used (0/44).

  - field: category
    articles_with_field: 60
    article_vocab: [foundations, applied]
    classification_yaml_vocab: "(none — `category` is NOT one of the 9 classification layers)"
    divergence: >-
      `category` is not a declared classification layer at all. Its two values
      (foundations 44, applied 16) mirror the content-tree track names
      (1-foundations, 2-applied). No `playbooks` value exists despite 3 articles
      setting track:3. Functions as a track-derived structural field the ontology
      does not model.

  - field: track
    articles_with_field: 67
    article_vocab: ['1', '2', '3']
    classification_yaml_vocab: "(none — `track` is NOT a classification layer)"
    divergence: >-
      `track` is a numeric structural content-tree id (1:44, 2:20, 3:3), not one of
      the 9 classification attribute-layers. A different axis (structural placement)
      than anything the ontology's classification layer declares.

  - field: audience
    articles_with_field: 67
    articles_with_value: 65
    article_vocab: [grounded-regen, Individual, Community-Steward, DAO-Operator, Local-Organizer, Researcher]
    classification_yaml_vocab: [individual, "local organizer", "community steward", "DAO operator", developer, nonprofit, researcher]
    divergence: >-
      Partial match with drift. 5 of the 7 declared values appear only after
      case/hyphenation normalization (Individual→individual,
      Local-Organizer→"local organizer", Community-Steward→"community steward",
      DAO-Operator→"DAO operator", Researcher→researcher). The single most common
      value, `grounded-regen` (24), is OUT of the declared vocab. Declared
      `developer` and `nonprofit` are unused (0). Field shape is also inconsistent
      (scalar vs array; 2 empty).

  - field: tags.function
    articles_with_field: 41
    article_vocab: [Education, Governance, Security, Community-Building, Economic-Design, Impact-Measurement, Coordination, Identity, Infrastructure, Funding]
    classification_yaml_vocab: [education, "setup guide", "operational guide", strategy, pattern, "case study", "risk management", coordination]
    divergence: >-
      Largely a different vocabulary. After normalization only 2 of the 10 used
      values overlap the declared function vocab (education, coordination). The other
      8 (Governance, Security, Community-Building, Economic-Design,
      Impact-Measurement, Identity, Infrastructure, Funding) are OUT. Declared
      setup-guide, operational-guide, strategy, pattern, case-study, risk-management
      are unused. `tags.function` reads as a topic/subject vocabulary, not the
      ontology's purpose/function vocabulary.

  - field: tags.domain
    articles_with_field: 41
    article_vocab: [Technical, Web3-Literacy, Ecosystem, Community, Governance, Economics, Personal]
    classification_yaml_vocab: [ecological, social, economic, governance, technical, cultural, legal, educational]
    divergence: >-
      Substantial mismatch. After normalization only 2 of the 7 used values overlap
      exactly (technical, governance); `Economics` is a near-miss for declared
      `economic`. Web3-Literacy, Ecosystem, Community, Personal are OUT. Declared
      ecological, social, cultural, legal, educational are unused.

  - field: "scale / context / tech_surface / forms_of_capital"
    articles_with_field: 0
    divergence: >-
      Four of the ontology's 9 classification layers — including the flagship
      8-forms-of-capital extension — never appear in any article's frontmatter. The
      ontology declares them; the live content never populates them.
